    :root { --b: #76142E; --deep: #4E1022; --blue: #88B4C8; --deepblue: #244E66; --paper: #F7F4EE; --gold: #E8C879; --coral: #E5A596; --ink: #25252A; --muted: rgba(37,37,42,.62); --line: rgba(37,37,42,.12); --err: #A8201A; --err-soft: #FBE8EB; --warn-soft: #FFF3D6; }

    .top b { font-weight: 600; padding-left: 12px; border-left: 1px solid var(--line); }
    .top .sp { flex: 1; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 36px; padding: 6px 16px; border-radius: 999px; border: 1px solid rgba(37,37,42,.18); background: #fff; font-weight: 500; font-size: .88rem; white-space: nowrap; }
    .btn:hover { background: var(--paper); border-color: rgba(37,37,42,.3); }
    .btn-brand { background: var(--b); border-color: var(--b); color: #fff; font-weight: 600; } .btn-brand:hover { background: var(--deep); border-color: var(--deep); }
    .btn-sm { min-height: 30px; padding: 3px 12px; font-size: .8rem; }
    .btn-x { width: 30px; height: 30px; padding: 0; border-radius: 50%; color: var(--muted); } .btn-x:hover { background: var(--err-soft); color: var(--err); }
    .wrap { display: grid; grid-template-columns: minmax(360px, 480px) minmax(0, 1fr); gap: 20px; max-width: 1500px; margin: 0 auto; padding: 18px clamp(12px, 2vw, 24px) 60px; align-items: start; }
    .card { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin: 0 0 14px; }
    .card h2 { margin: 0 0 10px; font-size: .95rem; font-weight: 600; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .f { display: grid; gap: 3px; min-width: 0; }
    .f label { font-size: .76rem; font-weight: 500; color: var(--muted); }
    .f input, .f select, .f textarea { width: 100%; min-height: 36px; padding: 6px 10px; border-radius: 8px; border: 1px solid rgba(37,37,42,.2); background: #fff; }
    .f textarea { min-height: 60px; resize: vertical; }
    .f input:focus, .f select:focus, .f textarea:focus { outline: none; border-color: var(--deepblue); box-shadow: 0 0 0 3px rgba(36,78,102,.15); }
    .g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; } .g3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
    .seg { display: flex; gap: 4px; } .seg label { flex: 1; position: relative; } .seg input { position: absolute; opacity: 0; pointer-events: none; }
    .seg span { display: grid; place-items: center; min-height: 36px; border-radius: 999px; border: 1px solid rgba(37,37,42,.2); font-weight: 500; font-size: .84rem; cursor: pointer; text-align: center; padding: 0 8px; }
    .seg input:checked + span { background: rgba(118,20,46,.08); border-color: var(--b); color: var(--b); font-weight: 600; }
    .lines { display: grid; gap: 8px; margin: 0 0 10px; }
    .line { display: grid; grid-template-columns: 54px 70px minmax(0, 1fr) 110px 60px 30px; gap: 6px; align-items: end; }
    .line .f label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .line .f input { padding: 6px 8px; min-height: 34px; }
    .line-total { grid-column: 1 / -1; display: flex; justify-content: flex-end; gap: 10px; font-size: .8rem; color: var(--muted); margin-top: -4px; }
    .line-total b { color: var(--ink); }
    .cat { display: flex; gap: 6px; }
    .cat select { flex: 1; min-width: 0; max-width: 100%; }
    .side { min-width: 0; } .side .card { min-width: 0; overflow: hidden; }
    .hint { font-size: .78rem; color: var(--muted); margin: 6px 0 0; }
    .warn { padding: 8px 10px; border-radius: 8px; background: var(--warn-soft); font-size: .8rem; margin: 8px 0 0; }
    .err { padding: 8px 10px; border-radius: 8px; background: var(--err-soft); font-size: .8rem; margin: 8px 0 0; }
    .totals { display: grid; gap: 4px; font-size: .86rem; }
    .totals div { display: flex; justify-content: space-between; gap: 10px; } .totals .big { font-size: 1.05rem; font-weight: 600; border-top: 1px solid var(--line); padding-top: 6px; margin-top: 2px; }
    .hist { display: grid; gap: 6px; }
    .hist button { display: flex; justify-content: space-between; gap: 8px; width: 100%; text-align: left; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: #fff; font-size: .82rem; }
    .hist button:hover { background: rgba(136,180,200,.12); }
    .hist small { color: var(--muted); }
    .toast { position: fixed; left: 50%; bottom: 20px; z-index: 900; transform: translate(-50%, 20px); opacity: 0; pointer-events: none; background: var(--ink); color: #fff; padding: 9px 16px; border-radius: 999px; font-weight: 500; font-size: .86rem; transition: opacity .2s, transform .2s; }
    .toast.on { opacity: 1; transform: translate(-50%, 0); }
    dialog.pop { border: 0; padding: 0; border-radius: 14px; width: min(560px, calc(100vw - 20px)); max-height: calc(100dvh - 20px); background: #fff; color: var(--ink); box-shadow: 0 30px 80px -20px rgba(37,37,42,.4); }
    dialog.pop::backdrop { background: rgba(37,37,42,.5); }
    .pop-h { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--line); } .pop-h h2 { margin: 0; font-size: 1rem; font-weight: 600; }
    .pop-b { padding: 14px 18px; display: grid; gap: 10px; } .pop-f { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--line); background: var(--paper); }
    /* ---------- the sheet (A4) ---------- */
    .sheet-wrap { position: sticky; top: 70px; }
    .sheet { width: 210mm; min-height: 297mm; margin: 0 auto; background: #fff; color: var(--ink); box-shadow: 0 20px 50px -20px rgba(37,37,42,.35); padding: 16mm 16mm 14mm; font-size: 10.5pt; line-height: 1.45; display: flex; flex-direction: column; position: relative; font-family: 'Poppins', system-ui, sans-serif; }
    .sheet * { box-sizing: border-box; }
    .sh-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10mm; }
    .sh-brand { display: flex; align-items: center; gap: 4mm; } .sh-brand img { height: 11mm; width: auto; }
    .sh-brand div b { display: block; font-size: 12pt; font-weight: 600; line-height: 1.1; } .sh-brand div span { display: block; font-size: 8pt; color: var(--muted); }
    .sh-title { text-align: right; } .sh-title b { display: block; font-size: 20pt; font-weight: 600; color: var(--b); letter-spacing: -.01em; line-height: 1.05; }
    .sh-title span { display: block; font-size: 9pt; color: var(--muted); margin-top: 1mm; }
    .sh-stripe { display: flex; height: 2.2mm; margin: 5mm 0 7mm; } .sh-stripe i { display: block; height: 100%; } .sh-stripe i:nth-child(1) { width: 60%; background: var(--b); } .sh-stripe i:nth-child(2) { width: 25%; background: var(--blue); } .sh-stripe i:nth-child(3) { width: 15%; background: var(--gold); }
    .sh-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 8mm; font-size: 9pt; }
    .sh-meta h3 { margin: 0 0 1.5mm; font-size: 7.5pt; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--b); }
    .sh-meta p { margin: 0; } .sh-meta .box { padding: 3.5mm 4mm; border-radius: 2mm; background: var(--paper); }
    .sh-kv { display: grid; grid-template-columns: auto 1fr; gap: 1mm 4mm; } .sh-kv span { color: var(--muted); } .sh-kv p { margin: 0; }
    table.sh-t { width: 100%; border-collapse: collapse; margin: 7mm 0 0; font-size: 9.5pt; }
    .sh-t th { text-align: left; font-size: 7.5pt; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: #fff; background: var(--b); padding: 2.5mm 3mm; }
    .sh-t td { padding: 2.5mm 3mm; border-bottom: 1px solid var(--line); vertical-align: top; }
    .sh-t .r { text-align: right; white-space: nowrap; } .sh-t .c { text-align: center; }
    .sh-t td small { display: block; color: var(--muted); font-size: 8pt; }
    .sh-tot { display: flex; justify-content: flex-end; margin: 4mm 0 0; }
    .sh-tot table { border-collapse: collapse; font-size: 9.5pt; min-width: 72mm; }
    .sh-tot td { padding: 1.4mm 3mm; } .sh-tot td:first-child { color: var(--muted); } .sh-tot td:last-child { text-align: right; white-space: nowrap; }
    .sh-tot tr.grand td { background: var(--b); color: #fff; font-weight: 600; font-size: 11pt; padding: 2.8mm 3mm; } .sh-tot tr.grand td:first-child { color: #fff; border-radius: 2mm 0 0 2mm; } .sh-tot tr.grand td:last-child { border-radius: 0 2mm 2mm 0; }
    .sh-words { margin: 5mm 0 0; padding: 3.5mm 4mm; border-left: 1.2mm solid var(--gold); background: var(--paper); font-size: 9.5pt; }
    .sh-words span { display: block; color: var(--muted); font-size: 8pt; }
    .sh-words b { font-weight: 500; }
    .sh-pay { margin: 5mm 0 0; display: grid; grid-template-columns: 1fr 1fr; gap: 6mm; font-size: 9pt; }
    .sh-pay h3 { margin: 0 0 1.5mm; font-size: 7.5pt; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--b); }
    .sh-note { margin: 3mm 0 0; font-size: 8.5pt; color: var(--muted); white-space: pre-wrap; }
    .sh-sign { margin: 8mm 0 0; display: flex; justify-content: flex-end; }
    .sh-sign div { width: 62mm; font-size: 8.5pt; color: var(--muted); } .sh-sign b { display: block; color: var(--ink); font-weight: 600; margin-bottom: 14mm; }
    .sh-foot { margin-top: auto; padding-top: 4mm; border-top: 1px solid var(--line); display: flex; justify-content: space-between; gap: 4mm; font-size: 8pt; color: var(--muted); }
    .sh-foot b { color: var(--b); font-weight: 500; }
    .sh-pro { position: absolute; left: 0; right: 0; top: 46%; text-align: center; font-size: 46pt; font-weight: 600; color: rgba(118,20,46,.05); transform: rotate(-18deg); pointer-events: none; letter-spacing: .1em; }
    /* ---------- connexion ---------- */
    .lock { position: fixed; inset: 0; z-index: 700; display: grid; place-items: center; padding: 20px; overflow-y: auto; background: var(--b); }
    .lock-card { width: min(100%, 400px); background: var(--paper); border-radius: 14px; padding: 28px 26px 22px; box-shadow: 0 30px 80px -20px rgba(0,0,0,.5); }
    .lock-card .seal { display: flex; justify-content: center; margin: 0 auto 14px; } .lock-card .seal img { height: 34px; }
    .lock-card h1 { margin: 0 0 4px; font-size: 1.4rem; font-weight: 600; text-align: center; letter-spacing: -.01em; }
    .lock-card .lead { margin: 0 0 16px; text-align: center; color: var(--muted); font-size: .88rem; }
    .lock-card form { display: grid; gap: 12px; } .lock-card .btn { width: 100%; min-height: 44px; }
    .lock-msg { margin: 0 0 12px; padding: 9px 12px; border-radius: 8px; background: var(--err-soft); font-size: .86rem; } .lock-msg.info { background: rgba(136,180,200,.25); color: var(--deepblue); }
    .linkish { background: none; border: 0; padding: 0; color: var(--b); font-weight: 500; font-size: .84rem; text-decoration: underline; justify-self: center; }
    .top .who { font-size: .8rem; color: var(--muted); }
    @media (max-width: 600px) { .top { flex-wrap: wrap; } .top .sp { display: none; } .g3 { grid-template-columns: 1fr 1fr; } .g3 .f:last-child { grid-column: 1 / -1; } .line { grid-template-columns: 1fr 1fr 1fr; } .line .f:nth-child(3) { grid-column: 1 / -1; } .line .btn-x { align-self: end; } }
    @media (max-width: 1180px) { .wrap { grid-template-columns: 1fr; } .sheet-wrap { position: static; overflow: hidden; } .sheet { transform-origin: top left; } }
    @media print {
      @page { size: A4; margin: 0; }
      body { background: #fff; }
      .top, .side, .toast, dialog { display: none !important; }
      .wrap { display: block; padding: 0; margin: 0; max-width: none; }
      .sheet-wrap { position: static; }
      .sheet { width: 210mm; min-height: 297mm; box-shadow: none; margin: 0; padding: 16mm 16mm 14mm; }
      .sh-t th, .sh-tot tr.grand td { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
  </style>

      c.lines.filter(l => l.desc || l.price).map(l => '<tr><td class="c num">' + nf0.format(l.qty) + '</td><td>' + esc(l.ref) + '</td><td>' + esc(l.desc) + '</td><td class="r num">' + da(l.price) + '</td>' + (c.lineDisc ? '<td class="r num">' + (l.disc ? l.disc + ' %' : '—') + '</td>' : '') + '<td class="r num">' + da(l.net) + '</td></tr>').join('') + '</tbody></table>' +
    '<div class="sh-tot"><table>' + (c.gdisc || c.lineDisc ? '<tr><td>Total brut</td><td class="num">' + da(c.gross) + '</td></tr>' : '') + (c.lineDisc ? '<tr><td>Remises sur lignes</td><td class="num">− ' + da(c.lineDisc) + '</td></tr>' : '') + (c.gdisc ? '<tr><td>Remise globale' + (d.discMode === 'pct' ? ' (' + nf0.format(d.disc) + ' %)' : '') + '</td><td class="num">− ' + da(c.gdisc) + '</td></tr>' : '') +
      '<tr><td>Total HT</td><td class="num">' + da(c.ht) + '</td></tr>' + (d.tva ? '<tr><td>TVA ' + d.tva + ' %</td><td class="num">' + da(c.tva) + '</td></tr>' : '') + (c.stamp ? '<tr><td>Droit de timbre</td><td class="num">' + da(c.stamp) + '</td></tr>' : '') +
      '<tr class="grand"><td>Total TTC</td><td class="num">' + da(c.ttc) + '</td></tr></table></div>' +
    (!d.tva && d.tvaNote ? '<p style="margin:2mm 0 0;text-align:right;font-size:8pt;color:var(--muted)">' + esc(d.tvaNote) + '</p>' : '') +
    '<div class="sh-words"><span>' + (d.kind === 'devis' ? 'Arrêté le présent devis à la somme de' : d.kind === 'proforma' ? 'Arrêtée la présente facture proforma à la somme de' : 'Arrêtée la présente facture à la somme de') + '</span><b>' + esc(amountWords(c.ttc)) + '</b></div>' +
    '<div class="sh-pay"><div><h3>Règlement</h3><p><b>' + esc(PAY[d.pay]) + '</b></p>' + (d.pay !== 'especes' ? '<div class="sh-kv" style="margin-top:1.5mm"><span>Banque</span><p>' + esc(S.bank) + '</p><span>Titulaire</span><p>' + esc(S.acc) + '</p><span>RIB</span><p>' + esc(S.rib) + '</p></div>' : '<p>Droit de timbre inclus.</p>') + '</div>' +
      '<div>' + (d.note ? '<h3>Conditions</h3><p class="sh-note" style="margin:0">' + esc(d.note) + '</p>' : '') + '</div></div>' +
    '<div class="sh-sign"><div><b>Cachet et signature</b>' + esc(S.name) + '</div></div>' +
    '<div class="sh-foot"><span>' + esc(S.name) + (S.form ? ' · ' + esc(S.form) : '') + ' · ' + esc(S.addr) + '</span><span><b>' + esc(S.web) + '</b></span></div>';
}

/* ==================== Enregistrer, historique ==================== */
function save() {
  readForm(); const p = problems(cur).filter(x => !/Facture définitive/.test(x));
  if (p.length) { toast(p[0]); return; }
  if (!cur.id) cur.id = Date.now().toString(36);
  cur.savedAt = new Date().toISOString();
  const c = compute(cur); cur.total = c.ttc;
  const i = docs.findIndex(x => x.id === cur.id); if (i >= 0) docs[i] = clone(cur); else docs.unshift(clone(cur));
  drawHist();
  fb.F.setDoc(fb.F.doc(fb.db, 'invoices', cur.id), clone(cur)).then(() => toast(KINDS[cur.kind][0] + ' ' + cur.num + ' enregistrée')).catch(() => toast('Enregistrement impossible. Vérifiez la connexion.'));
}
function drawHist() {
  $('histCount').textContent = docs.length ? docs.length + ' document' + (docs.length > 1 ? 's' : '') : '';
  $('hist').innerHTML = docs.length ? docs.slice().sort((a, b) => (b.savedAt || '').localeCompare(a.savedAt || '')).slice(0, 60).map(d => '<button type="button" data-open="' + esc(d.id) + '"><span><b>' + esc(d.num) + '</b> · ' + esc(d.client.name) + '<br><small>' + esc(KINDS[d.kind][0]) + ' · ' + esc(frDate(d.date)) + '</small></span><b class="num">' + da(d.total || 0) + '</b></button>').join('') : '<p class="hint" style="margin:0">Les documents enregistrés apparaissent ici, depuis tous vos appareils.</p>';
}
function openDoc(id) { const d = docs.find(x => x.id === id); if (!d) return; cur = JSON.parse(JSON.stringify(d)); writeForm(); window.scrollTo(0, 0); }
function newDoc(kind) { cur = blank(); if (kind) cur.kind = kind; cur.num = nextNum(cur.kind, cur.date); writeForm(); }
function dupAsInvoice() {
  readForm(); const src = cur;
  cur = JSON.parse(JSON.stringify(src)); cur.id = ''; cur.kind = 'facture'; cur.date = todayISO(); cur.num = nextNum('facture', cur.date); cur.savedAt = '';
  cur.note = (src.note ? src.note + '\n' : '') + (src.kind !== 'facture' ? 'Suite à ' + KINDS[src.kind][0].toLowerCase() + ' n° ' + src.num + '.' : '');
  writeForm(); toast('Facture préparée à partir de ' + src.num);
}
function exportCsv() {
  if (!docs.length) { toast('Rien à exporter.'); return; }
  const cell = v => { v = String(v == null ? '' : v); return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  const rows = [['Type', 'Numéro', 'Date', 'Client', 'Pour', 'Réf. client', 'Total HT', 'TVA', 'Timbre', 'Total TTC', 'Règlement', 'Lignes'].join(',')];
  docs.forEach(d => { const c = compute(d); rows.push([KINDS[d.kind][0], d.num, d.date, d.client.name, d.client.for, d.client.id, c.ht, c.tva, c.stamp, c.ttc, PAY[d.pay], d.lines.map(l => l.qty + ' × ' + l.desc + ' @ ' + l.price).join(' | ')].map(cell).join(',')); });
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['\uFEFF' + rows.join('\r\n')], { type: 'text/csv;charset=utf-8' })); a.download = 'juniors-factures-' + todayISO() + '.csv'; document.body.appendChild(a); a.click(); a.remove();
}

/* ==================== Réglages ==================== */
function openSettings() {
  [['sName', 'name'], ['sForm', 'form'], ['sAct', 'act'], ['sAddr', 'addr'], ['sRC', 'rc'], ['sNIF', 'nif'], ['sNIS', 'nis'], ['sAI', 'ai'], ['sPhone', 'phone'], ['sEmail', 'email'], ['sWeb', 'web'], ['sBank', 'bank'], ['sAcc', 'acc'], ['sRib', 'rib'], ['sCat', 'cat']].forEach(([i, k]) => { $(i).value = S[k] || ''; });
  $('setPop').showModal();
}
$('setForm').addEventListener('submit', e => {
  e.preventDefault();
  [['sName', 'name'], ['sForm', 'form'], ['sAct', 'act'], ['sAddr', 'addr'], ['sRC', 'rc'], ['sNIF', 'nif'], ['sNIS', 'nis'], ['sAI', 'ai'], ['sPhone', 'phone'], ['sEmail', 'email'], ['sWeb', 'web'], ['sBank', 'bank'], ['sAcc', 'acc'], ['sRib', 'rib'], ['sCat', 'cat']].forEach(([i, k]) => { S[k] = $(i).value.trim(); });
  $('setPop').close(); fillCat(); refresh();
  fb.F.setDoc(fb.F.doc(fb.db, 'settings', 'company'), clone(S)).then(() => toast('Réglages enregistrés')).catch(() => toast('Enregistrement impossible. Vérifiez la connexion.'));
});
function fillCat() { $('catSel').innerHTML = '<option value="">Choisir dans le catalogue…</option>' + catalogue().map((c, i) => '<option value="' + i + '">' + esc(c.ref + ' · ' + c.desc + (c.price ? ' · ' + da(c.price) : '')) + '</option>').join(''); }

/* ==================== Événements ==================== */
document.addEventListener('input', e => {
  if (e.target.closest('.side')) {
    if (e.target.name === 'kind') { const k = e.target.value; readForm(); if (!cur.id || !cur.num || /^(PRO|FAC|DEV)\//.test(cur.num)) $('num').value = nextNum(k, $('date').value); }
    refresh();
  }
});
document.addEventListener('change', e => { if (e.target.closest('.side')) { if (e.target.id === 'date' && !cur.id) $('num').value = nextNum(document.querySelector('input[name=kind]:checked').value, e.target.value); refresh(); } });
document.addEventListener('click', e => {
  const c = s => e.target.closest(s); let el;
  if (c('#addLine')) { readForm(); cur.lines.push({ qty: 1, ref: '', desc: '', price: 0, disc: 0 }); drawLines(); const last = document.querySelector('#lines .line:last-child [data-k=desc]'); if (last) last.focus(); return; }
  if (c('#catAdd')) { const i = $('catSel').value; if (i === '') return; const it = catalogue()[+i]; readForm(); const empty = cur.lines.findIndex(l => !l.desc && !l.price); const line = { qty: 1, ref: it.ref, desc: it.desc, price: it.price, disc: 0 }; if (empty >= 0) cur.lines[empty] = line; else cur.lines.push(line); drawLines(); $('catSel').value = ''; return; }
  if ((el = c('[data-del]'))) { readForm(); cur.lines.splice(+el.getAttribute('data-del'), 1); if (!cur.lines.length) cur.lines.push({ qty: 1, ref: '', desc: '', price: 0, disc: 0 }); drawLines(); return; }
  if (c('#btnSave')) return save();
  if (c('#btnDup')) return dupAsInvoice();
  if (c('#btnCsv')) return exportCsv();
  if (c('#btnNew')) return newDoc();
  if (c('#btnSettings')) return openSettings();
  if (c('#btnPrint')) { readForm(); const p = problems(cur); if (p.length && !confirm('À vérifier avant d’imprimer :\n\n' + p.join('\n') + '\n\nImprimer quand même ?')) return; window.print(); return; }
  if ((el = c('[data-open]'))) return openDoc(el.getAttribute('data-open'));
  if (c('[data-close]')) { const d = c('dialog'); if (d) d.close(); }
});
document.querySelectorAll('dialog.pop').forEach(d => d.addEventListener('click', e => { if (e.target === d) d.close(); }));
window.addEventListener('beforeprint', () => { readForm(); refresh(); });
/* la feuille se réduit pour tenir sur un écran étroit */
function fitSheet() { const w = document.querySelector('.sheet-wrap').clientWidth, sheet = $('sheet'); const k = Math.min(1, (w - 2) / sheet.offsetWidth); sheet.style.transform = k < 1 ? 'scale(' + k + ')' : ''; document.querySelector('.sheet-wrap').style.height = k < 1 ? (sheet.offsetHeight * k) + 'px' : ''; }
window.addEventListener('resize', fitSheet);

/* ==================== Connexion et données en ligne ==================== */
function gate(mode, msg, info) {
  const g = $('lock'); g.hidden = mode === 'off'; g.setAttribute('data-mode', mode);
  $('lockForm').hidden = mode !== 'signin';
  $('gateLead').textContent = mode === 'loading' ? 'Ouverture…' : mode === 'signin' ? 'Connectez-vous avec l’email et le mot de passe du directeur.' : '';
  $('gateLead').hidden = !$('gateLead').textContent;
  $('lockMsg').textContent = msg || ''; $('lockMsg').hidden = !msg; $('lockMsg').classList.toggle('info', !!info);
  if (mode === 'signin') setTimeout(() => $('lEmail').focus(), 50);
}
function authMessage(e) {
  const c = (e && e.code) || '';
  if (/invalid-credential|wrong-password|user-not-found|invalid-email|missing-password/.test(c)) return 'Email ou mot de passe incorrect.';
  if (/too-many-requests/.test(c)) return 'Trop d’essais. Attendez quelques minutes.';
  if (/network-request-failed/.test(c)) return 'Pas de connexion internet.';
  return 'Connexion impossible. Réessayez.';
}
async function start() {
  gate('loading');
  try {
    const [A0, A, F] = await Promise.all([import(FB + 'firebase-app.js'), import(FB + 'firebase-auth.js'), import(FB + 'firebase-firestore.js')]);
    const app = A0.initializeApp(FIREBASE_CONFIG);
    let db; try { db = F.initializeFirestore(app, { localCache: F.persistentLocalCache({ tabManager: F.persistentMultipleTabManager() }) }); } catch (e) { db = F.getFirestore(app); }
    fb = { auth: A.getAuth(app), db, A, F };
    A.onAuthStateChanged(fb.auth, u => { u ? signedIn(u) : signedOut(); });
  } catch (e) { gate('signin', 'Impossible de joindre la base en ligne. Vérifiez la connexion puis rechargez la page.'); }
}
function signedOut() { unsub.forEach(f => { try { f(); } catch (e) {} }); unsub = []; me = null; docs = []; $('app').hidden = true; if ($('lock').getAttribute('data-mode') !== 'signin') gate('signin'); }
function signedIn(u) {
  const email = (u.email || '').toLowerCase();
  if (!DIRECTOR_EMAILS.map(x => x.toLowerCase()).includes(email)) { fb.A.signOut(fb.auth); gate('signin', 'Cet email n’est pas autorisé à ouvrir les factures.'); return; }
  me = { uid: u.uid, email }; gate('off'); $('app').hidden = false; $('who').textContent = email;
  const { F, db } = fb;
  let first = true;
  unsub.push(F.onSnapshot(F.doc(db, 'settings', 'company'), d => { if (d.exists()) S = Object.assign({}, DEFAULT_SETTINGS, d.data()); fillCat(); refresh(); }, () => {}));
  unsub.push(F.onSnapshot(F.collection(db, 'invoices'), snap => {
    docs = snap.docs.map(d => d.data()); drawHist();
    if (first) { first = false; newDoc('proforma'); } else if (!cur.id) { const n = nextNum(cur.kind, cur.date); if (!$('num').value || /^(PRO|FAC|DEV)\//.test($('num').value)) { $('num').value = n; refresh(); } }
  }, err => { if (err && err.code === 'permission-denied') { fb.A.signOut(fb.auth); gate('signin', 'Cet email est dans index.html mais pas dans les règles Firestore. Ajoutez-le aux règles, puis reconnectez-vous.'); } }));
  fitSheet();
}
$('lockForm').addEventListener('submit', async e => {
  e.preventDefault(); const btn = $('lSubmit'); btn.disabled = true; btn.textContent = 'Connexion…';
  try { await fb.A.signInWithEmailAndPassword(fb.auth, $('lEmail').value.trim(), $('lPass').value); $('lPass').value = ''; }
  catch (err) { gate('signin', authMessage(err)); }
  finally { btn.disabled = false; btn.textContent = 'Se connecter'; }
});
$('gForgot').addEventListener('click', async () => {
  const email = $('lEmail').value.trim();
  if (!email) { gate('signin', 'Tapez d’abord votre email, puis cliquez à nouveau sur « Mot de passe oublié ».', true); return; }
  try { await fb.A.sendPasswordResetEmail(fb.auth, email); } catch (e) {}
  gate('signin', 'Si ce compte existe, un email pour choisir un nouveau mot de passe est en route.', true);
});
$('btnOut').addEventListener('click', () => { if (confirm('Se déconnecter ?')) fb.A.signOut(fb.auth); });

fillCat(); drawHist(); writeForm(); fitSheet(); start();
window.__inv = { words, amountWords, compute };
</script>
