  <style>
    /* ============================================================
       JUNIORS HQ — every Juniors Academy platform in one place (juniors.academy/hq)
       Its own Firebase project: juniors-hq (sign-in and the daily check).
       To add or change a link, edit the PLATFORMS / TOOLS lists below.
       ============================================================ */
    :root {
      /* Juniors Academy brand, v1.0 (purple-led). Only these eight colours, plus tints of them. */
      --ja-purple: #4A235A; --ja-crimson: #DC143C; --ja-paper: #FAFAF7; --ja-ink: #14101A;
      --ja-night: #2B1236; --ja-lavender: #EDE9EE; --ja-blush: #FCE8EC; --ja-sun: #FFC23D;
      --ja-prism: conic-gradient(#4A235A 0deg, #7A2166 45deg, #B31A4E 90deg, #DC143C 135deg, #F2683E 180deg, #FFC23D 225deg, #F0A08F 270deg, #B4708F 315deg, #4A235A 360deg);
      --slant: skewX(-20deg);
      --ink: var(--ja-ink); --paper: var(--ja-paper); --card: #fff; --muted: rgba(20,16,26,.6); --body: rgba(20,16,26,.8); --line: rgba(74,35,90,.16);
      --ok: var(--ja-purple); --ok-soft: var(--ja-lavender); --red: var(--ja-crimson); --red-soft: var(--ja-blush);
      --ease: cubic-bezier(.16, 1, .3, 1); --display: 'Poppins', 'Cairo', system-ui, sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: 'Poppins', 'Cairo', system-ui, -apple-system, sans-serif; font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
    button, input { font: inherit; color: inherit; }
    button { cursor: pointer; }
    a { color: inherit; }
    :focus-visible { outline: 3px solid var(--ja-purple); outline-offset: 2px; border-radius: 10px; }
    [hidden] { display: none !important; }
    svg.i { width: 20px; height: 20px; flex: none; }

    .mark { display: grid; flex: none; }
    .mark i { border-radius: 2px; }

    .top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px; padding: 10px clamp(12px, 3vw, 28px); padding-top: calc(10px + env(safe-area-inset-top, 0px)); background: var(--ink); color: #fff; }
    .top b { font-family: var(--display); font-size: 1.1rem; letter-spacing: -.01em; }
    .top .sp { flex: 1; }
    .top .who { font-size: .8rem; color: rgba(255,255,255,.6); white-space: nowrap; }
    .tbtn { min-height: 34px; padding: 5px 14px; border-radius: 999px; border: 1px solid rgba(255,255,255,.2); background: rgba(255,255,255,.07); color: #fff; font-weight: 600; font-size: .84rem; }
    .tbtn:hover { background: rgba(255,255,255,.16); }

    .wrap { max-width: 1180px; margin: 0 auto; padding: 26px clamp(12px, 3vw, 28px) 60px; }
    .hi h1 { margin: 0 0 4px; font-family: var(--display); font-size: clamp(1.7rem, 3.4vw, 2.4rem); letter-spacing: -.02em; line-height: 1.08; }
    .hi p { margin: 0 0 22px; color: var(--muted); font-size: .95rem; }
    .hi p b { color: var(--ink); font-weight: 600; }

    .h2 { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 0 0 10px; }
    .h2 h2 { margin: 0; font-family: var(--display); font-size: 1.1rem; letter-spacing: -.01em; }
    .h2 small { color: var(--muted); font-size: .8rem; }
    kbd { font: 600 .72rem var(--display); padding: 1px 6px; border-radius: 5px; border: 1px solid var(--line); background: #fff; color: var(--body); }

    .apps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin: 0 0 22px; }
    .app { position: relative; display: flex; flex-direction: column; gap: 12px; padding: 16px 18px; border-radius: 20px; background: var(--card); border: 1px solid var(--line); text-decoration: none; transition: transform .25s var(--ease), box-shadow .25s var(--ease), border-color .25s; }
    .app:hover { transform: translateY(-3px); border-color: color-mix(in srgb, var(--c) 45%, transparent); box-shadow: 0 16px 30px -22px color-mix(in srgb, var(--c) 80%, #000); }
    .app-top { display: flex; align-items: center; gap: 12px; }
    .tile { width: 46px; height: 46px; border-radius: 13px; display: grid; place-items: center; background: var(--c); color: #fff; flex: none; }
    .tile svg { width: 24px; height: 24px; }
    .app b { display: block; font-family: var(--display); font-size: 1.18rem; letter-spacing: -.01em; }
    .app span.d { display: block; color: var(--muted); font-size: .86rem; }
    .app .go { margin-left: auto; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); background: var(--paper); transition: background .25s, color .25s, transform .25s var(--ease); }
    .app:hover .go { background: var(--c); color: #fff; transform: rotate(-45deg); }
    .app .go svg { width: 16px; height: 16px; }
    .app-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: .8rem; color: var(--muted); }
    .app-foot kbd { margin-left: auto; }

    .lower { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 12px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 16px 18px; }
    .prog { height: 6px; border-radius: 999px; background: var(--paper); overflow: hidden; margin: 0 0 6px; }
    .prog i { display: block; height: 100%; width: 0; background: var(--ok); border-radius: inherit; transition: width .5s var(--ease); }
    .checks { list-style: none; margin: 0; padding: 0; }
    .checks li { display: flex; align-items: center; gap: 12px; padding: 10px 2px; border-top: 1px solid var(--line); }
    .checks li:first-child { border-top: 0; }
    .tick { flex: none; width: 24px; height: 24px; border-radius: 50%; border: 2px solid rgba(20,24,29,.22); background: #fff; display: grid; place-items: center; padding: 0; transition: background .2s, border-color .2s; }
    .tick svg { width: 13px; height: 13px; color: #fff; opacity: 0; transform: scale(.4); transition: opacity .2s, transform .25s var(--ease); }
    .tick:hover { border-color: var(--ok); }
    .checks li.done .tick { background: var(--ok); border-color: var(--ok); }
    .checks li.done .tick svg { opacity: 1; transform: none; }
    .checks .t { flex: 1; min-width: 0; }
    .checks .t b { display: block; font-weight: 600; font-size: .92rem; }
    .checks li.done .t b { color: var(--muted); text-decoration: line-through; text-decoration-color: rgba(20,24,29,.25); }
    .checks .t small { display: block; color: var(--muted); font-size: .78rem; }
    .open { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 999px; font-size: .78rem; font-weight: 600; text-decoration: none; color: var(--c); background: color-mix(in srgb, var(--c) 10%, transparent); white-space: nowrap; }
    .open:hover { background: color-mix(in srgb, var(--c) 18%, transparent); }
    .alldone { margin: 10px 0 0; padding: 10px 12px; border-radius: 12px; background: var(--ok-soft); color: var(--ok); font-weight: 600; font-size: .88rem; text-align: center; }

    .tools { display: grid; gap: 14px; }
    .tools h3 { margin: 0 0 8px; font-size: .78rem; font-weight: 600; color: var(--muted); }
    .chips { display: flex; flex-wrap: wrap; gap: 7px; }
    .chip { display: inline-flex; align-items: center; gap: 7px; min-height: 34px; padding: 6px 13px; border-radius: 999px; border: 1px solid var(--line); background: var(--paper); font-size: .85rem; font-weight: 600; text-decoration: none; transition: border-color .2s, background .2s; }
    .chip:hover { border-color: rgba(20,24,29,.28); background: #fff; }
    .chip svg { width: 16px; height: 16px; color: var(--muted); }
    .chip i { width: 9px; height: 9px; border-radius: 3px; background: var(--c); flex: none; }

    .gate { position: fixed; inset: 0; z-index: 700; display: grid; place-items: center; padding: 20px; overflow-y: auto; background: var(--ink); }
    .gate-card { width: min(100%, 400px); background: var(--paper); border-radius: 26px; padding: 32px 26px 24px; box-shadow: 0 40px 100px -30px rgba(0,0,0,.7); }
    .gate-card .mark { margin: 0 auto 16px; width: 46px; height: 46px; padding: 8px; gap: 3px; border-radius: 13px; }
    .gate-card h1 { margin: 0 0 6px; font-family: var(--display); font-size: 1.55rem; letter-spacing: -.02em; text-align: center; }
    .gate-card .lead { margin: 0 0 18px; text-align: center; color: var(--muted); font-size: .9rem; }
    .gate-card form { display: grid; gap: 12px; }
    .fld { display: grid; gap: 4px; }
    .fld label { font-size: .76rem; font-weight: 600; color: var(--body); }
    .fld input { width: 100%; min-height: 44px; padding: 8px 12px; border-radius: 12px; border: 1px solid rgba(20,24,29,.16); background: #fff; }
    .fld input:focus { outline: none; border-color: var(--ink); box-shadow: 0 0 0 3px rgba(20,24,29,.08); }
    .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 46px; padding: 10px 18px; border-radius: 999px; border: 0; background: var(--ink); color: #fff; font-weight: 600; width: 100%; }
    .btn:disabled { opacity: .6; }
    .msg { margin: 0 0 12px; padding: 10px 12px; border-radius: 12px; font-size: .86rem; font-weight: 500; }
    .linkish { background: none; border: 0; padding: 0; color: var(--muted); font-weight: 600; font-size: .84rem; text-decoration: underline; justify-self: center; }


    /* ==================== JUNIORS ACADEMY BRAND ==================== */
    /* the prism: the HQ mark and every platform tile */
    .mark { width: 32px; height: 32px; padding: 3px; border-radius: 50%; background: var(--ja-prism); display: grid; place-items: center; gap: 0; }
    .mark > span { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; place-content: center; width: 100%; height: 100%; border-radius: 50%; background: var(--ja-purple); padding: 0 6px; }
    .mark > span i { width: 4px; height: 4px; border-radius: 1px; background: #fff; }
    .gate-card .mark { width: 54px; height: 54px; padding: 4px; margin: 0 auto 16px; border-radius: 50%; }
    .gate-card .mark > span { gap: 3px; padding: 0 12px; } .gate-card .mark > span i { width: 6px; height: 6px; }
    .tile { width: 48px; height: 48px; border-radius: 50%; padding: 3px; background: var(--ja-prism); }
    .tile > span { display: grid; place-items: center; width: 100%; height: 100%; border-radius: 50%; background: var(--ja-purple); color: #fff; }
    .tile svg { width: 22px; height: 22px; }
    /* headline: Poppins Bold Italic, capitals, the 4 px Sun rule */
    .hi h1, .gate-card h1 { font-weight: 700; font-style: italic; text-transform: uppercase; letter-spacing: -.015em; color: var(--ja-purple); }
    .hi h1::after { content: ""; display: block; width: 56px; height: 4px; background: var(--ja-sun); margin-top: 10px; }
    .h2 h2, .app b, .top b { font-weight: 600; letter-spacing: 0; }
    /* purple header */
    .top { background: var(--ja-purple); }
    /* platform cards */
    .app { border-radius: 12px; }
    .app:hover { border-color: rgba(74,35,90,.45); box-shadow: 0 16px 30px -22px rgba(74,35,90,.8); }
    .app:hover .go { background: var(--ja-purple); color: #fff; }
    kbd { border-color: var(--line); color: var(--ja-purple); }
    /* daily check */
    .card { border-radius: 12px; }
    .prog { background: var(--ja-lavender); } .prog i { background: var(--ja-purple); }
    .checks li.done .tick { background: var(--ja-purple); border-color: var(--ja-purple); } .tick:hover { border-color: var(--ja-purple); }
    .open { position: relative; isolation: isolate; background: transparent; color: var(--ja-purple); border-radius: 0; }
    .open::before { content: ""; position: absolute; inset: 0; z-index: -1; background: var(--ja-lavender); transform: var(--slant); border-radius: 3px; }
    .open:hover { background: transparent; } .open:hover::before { background: rgba(74,35,90,.16); }
    .alldone { background: var(--ja-sun); color: var(--ja-ink); border-radius: 8px; }
    /* website and tools: slanted chips */
    .chip { position: relative; isolation: isolate; background: transparent; border-color: transparent; border-radius: 0; }
    .chip::before { content: ""; position: absolute; inset: 0; z-index: -1; background: var(--ja-paper); border: 1px solid var(--line); transform: var(--slant); border-radius: 4px; transition: background .2s, border-color .2s; }
    .chip:hover { background: transparent; border-color: transparent; } .chip:hover::before { background: #fff; border-color: rgba(74,35,90,.4); }
    .chip svg { color: var(--ja-purple); }
    .chip i { background: var(--ja-purple); border-radius: 50%; }
    /* sign in: Night ground, purple slanted button */
    .gate { background: var(--ja-night); }
    .gate-card { background: var(--ja-paper); border-radius: 16px; }
    .btn { position: relative; isolation: isolate; background: transparent; border-radius: 6px; }
    .btn::before { content: ""; position: absolute; inset: 0; z-index: -1; background: var(--ja-purple); transform: var(--slant); border-radius: 4px; transition: background .15s; }
    .btn:hover::before { background: var(--ja-night); }
    .fld input:focus { border-color: var(--ja-purple); box-shadow: 0 0 0 3px var(--ja-lavender); }
    .msg { background: var(--ja-blush); color: var(--ja-ink); } .msg.info { background: var(--ja-lavender); color: var(--ja-purple); }
    .linkish { color: var(--ja-purple); }

    @media (max-width: 980px) { .apps { grid-template-columns: repeat(2, minmax(0, 1fr)); } .lower { grid-template-columns: 1fr; } }
    @media (max-width: 560px) {
      .apps { grid-template-columns: 1fr; gap: 10px; } .app { padding: 14px 16px; } .app-foot kbd, .h2 .keys, .top .who { display: none; }
      .checks .open span { display: none; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
  </style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-crm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c.6-3.3 3-5.2 6-5.2s5.4 1.9 6 5.2"/><path d="M16 4.5a3.2 3.2 0 0 1 0 6.3M18 14.9c1.6.7 2.7 2.4 3 5.1"/></symbol>
  <symbol id="i-hr" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1M9 11l2 2 4-4M9 17h6"/></symbol>
  <symbol id="i-chat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 9.5h8M8 12.5h5"/></symbol>
  <symbol id="i-tracker" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><circle cx="12" cy="10" r="3"/><path d="M9 16.5h6"/></symbol>
  <symbol id="i-alumni" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c0 1.6 2.7 3 6 3s6-1.4 6-3v-5M22 9v5"/></symbol>
  <symbol id="i-agent" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></symbol>
  <symbol id="i-globe" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></symbol>
  <symbol id="i-ext" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></symbol>
</svg>

<div class="gate" id="gate">
  <div class="gate-card">
    <span class="mark" aria-hidden="true"><span><i></i><i></i><i></i><i></i><i></i><i></i></span></span>
    <h1>Juniors HQ</h1>
    <p class="lead" id="gLead">Opening…</p>
    <p class="msg" id="gMsg" role="alert" hidden></p>
    <form id="signForm" hidden novalidate>
      <div class="fld"><label for="gEmail">Email</label><input id="gEmail" type="email" autocomplete="username" required></div>
      <div class="fld"><label for="gPass">Password</label><input id="gPass" type="password" autocomplete="current-password" required></div>
      <button type="submit" class="btn" id="gSubmit">Sign in</button>
      <button type="button" class="linkish" id="gForgot">Forgot my password</button>
    </form>
  </div>
</div>

<div id="app" hidden>
  <header class="top">
    <span class="mark" aria-hidden="true"><span><i></i><i></i><i></i><i></i><i></i><i></i></span></span>
    <b>Juniors HQ</b><span class="sp"></span><span class="who" id="who"></span><button type="button" class="tbtn" id="btnOut">Sign out</button>
  </header>
  <main class="wrap">
    <section class="hi"><h1 id="hello">Hello</h1><p id="today"></p></section>
    <div class="h2"><h2>Your platforms</h2><small class="keys">Press <kbd>1</kbd> to <kbd>6</kbd> to open</small></div>
    <nav class="apps" id="apps" aria-label="Platforms"></nav>
    <div class="lower">
      <section class="card" aria-labelledby="dcTitle">
        <div class="h2"><h2 id="dcTitle">Daily check</h2><small id="dcCount"></small></div>
        <div class="prog"><i id="dcBar"></i></div>
        <ul class="checks" id="checks"></ul>
        <p class="alldone" id="allDone" hidden>All done for today. The list resets tomorrow morning.</p>
      </section>
      <section class="card tools" aria-labelledby="tlTitle">
        <div class="h2" style="margin:0"><h2 id="tlTitle">Website and tools</h2></div>
        <div><h3>Website</h3><div class="chips" id="site"></div></div>
        <div><h3>Online services</h3><div class="chips" id="services"></div></div>
        <div><h3>Firebase console</h3><div class="chips" id="firebase"></div></div>
      </section>
    </div>
  </main>
</div>

<script type="module">
/* ============================================================
   SETTINGS — the Firebase project juniors-hq.
   Paste its six values below (Firebase > juniors-hq > Project settings > Your apps > Web).
   ============================================================ */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCm1izmDGtx3egfCwodMPz0682vFSQyPMQ",
  authDomain: "juniors-hq.firebaseapp.com",
  projectId: "juniors-hq",
  storageBucket: "juniors-hq.firebasestorage.app",
  messagingSenderId: "723161374500",
  appId: "1:723161374500:web:091e4badabfcec9d9d5db1"
};
const ALLOWED_EMAILS = ['director@juniors.academy'];
const FIRST_NAME = 'Yacine';

/* The six platforms, in the order of the keyboard shortcuts 1 to 6 */
const PLATFORMS = [
  { key: 'crm', name: 'CRM', desc: 'Leads and bookings', url: '/crm/', color: '#4A235A' },
  { key: 'hr', name: 'HR', desc: 'Team daily reports', url: '/hr/', color: '#4A235A' },
  { key: 'chat', name: 'Chat', desc: 'Team messages', url: '/chat/', color: '#4A235A' },
  { key: 'tracker', name: 'Tracker', desc: 'Files, visas and departures', url: '/tracker/', color: '#4A235A' },
  { key: 'alumni', name: 'Alumni', desc: 'Former students network', url: '/alumni/', color: '#4A235A' },
  { key: 'agent', name: 'Agents', desc: 'Partners by wilaya', url: '/agent/', color: '#4A235A' }
];
/* The daily check: one line per thing to look at, linked to its platform */
const CHECKS = [
  { id: 'crm', app: 'crm', text: 'Follow-ups due in the CRM', hint: 'Call back the leads due today' },
  { id: 'hr', app: 'hr', text: 'Yesterday\u2019s staff reports', hint: 'Read and reopen any to correct' },
  { id: 'tracker', app: 'tracker', text: 'Files needing attention', hint: 'Visas, passports and dates in red' },
  { id: 'agent', app: 'agent', text: 'New agent registrations', hint: 'Confirm or cancel the submitted ones' },
  { id: 'alumni', app: 'alumni', text: 'Posts waiting for approval', hint: 'And any reports from members' },
  { id: 'chat', app: 'chat', text: 'Unread team messages', hint: 'Channels and direct messages' }
];
const SITE = [
  ['Homepage', 'https://juniors.academy/'], ['Study in China', 'https://juniors.academy/study/'], ['Blog', 'https://juniors.academy/blog/'], ['Brochure form', 'https://juniors.academy/brochure/']
];
const SERVICES = [
  ['Search Console', 'https://search.google.com/search-console'], ['Formspree (brochure requests)', 'https://formspree.io/forms/xeajrbgb/submissions'],
  ['GitHub', 'https://github.com/'], ['Instagram', 'https://www.instagram.com/juniors.academy.dz']
];
const FIREBASE = [
  ['CRM', 'juniors-academy', '#4A235A'], ['HR', 'juniors-hr', '#4A235A'], ['Chat', 'juniors-chat', '#4A235A'],
  ['Tracker', 'juniors-tracker', '#4A235A'], ['Alumni', 'juniorsalumni', '#4A235A'], ['Agents', 'juniors-agent', '#4A235A'], ['HQ', 'juniors-hq', '#4A235A']
];
/* ============================================================ */

const FB = 'https://www.gstatic.com/firebasejs/12.19.0/';
const READY = !!(FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.projectId);
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const svg = n => '<svg class="i" aria-hidden="true"><use href="#i-' + n + '"/></svg>';
const TZ = 'Africa/Algiers';
const algiersDay = () => new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
const algiersHour = () => +new Intl.DateTimeFormat('en-GB', { timeZone: TZ, hour: '2-digit', hour12: false }).format(new Date());
let fb = null, me = null, done = {}, day = algiersDay(), unsub = null, refusal = '';

/* ---------- sign in ---------- */
function gate(mode, msg, info) {
  $('gate').hidden = mode === 'off'; $('app').hidden = mode !== 'off';
  $('signForm').hidden = mode !== 'signin';
  $('gLead').textContent = mode === 'signin' ? 'Sign in with the director account.' : mode === 'loading' ? 'Opening…' : '';
  $('gLead').hidden = !$('gLead').textContent;
  $('gMsg').textContent = msg || ''; $('gMsg').hidden = !msg; $('gMsg').className = 'msg' + (info ? ' info' : '');
  if (mode === 'signin') setTimeout(() => $('gEmail').focus(), 50);
}
async function start() {
  if (!READY) { gate('loading'); $('gLead').hidden = true; $('gMsg').hidden = false; $('gMsg').className = 'msg info'; $('gMsg').textContent = 'Almost ready: paste the Firebase settings of the juniors-hq project into FIREBASE_CONFIG, near the bottom of index.html.'; return; }
  gate('loading');
  try {
    const [A0, A, F] = await Promise.all([import(FB + 'firebase-app.js'), import(FB + 'firebase-auth.js'), import(FB + 'firebase-firestore.js')]);
    const app = A0.initializeApp(FIREBASE_CONFIG);
    fb = { auth: A.getAuth(app), db: F.getFirestore(app), A, F };
    A.onAuthStateChanged(fb.auth, async u => {
      if (!u) { me = null; if (unsub) { unsub(); unsub = null; } gate('signin', refusal); refusal = ''; return; }
      if (!ALLOWED_EMAILS.includes((u.email || '').toLowerCase())) { refusal = 'This account can\u2019t open Juniors HQ. Sign in with the director account.'; await A.signOut(fb.auth); return; }
      me = u; open();
    });
  } catch (e) { gate('signin', 'Couldn\u2019t reach the sign-in service. Check the connection and reload.'); }
}
$('signForm').addEventListener('submit', async e => {
  e.preventDefault(); const b = $('gSubmit'); b.disabled = true; b.textContent = 'Signing in…';
  try { await fb.A.signInWithEmailAndPassword(fb.auth, $('gEmail').value.trim(), $('gPass').value); $('gPass').value = ''; }
  catch (x) { const c = (x && x.code) || ''; gate('signin', /too-many/.test(c) ? 'Too many tries. Wait a few minutes.' : /network/.test(c) ? 'No internet connection.' : 'That email or password isn\u2019t right.'); }
  finally { b.disabled = false; b.textContent = 'Sign in'; }
});
$('gForgot').addEventListener('click', async () => {
  const email = $('gEmail').value.trim(); if (!email) { gate('signin', 'Type your email first, then click \u201cForgot my password\u201d again.', true); return; }
  try { await fb.A.sendPasswordResetEmail(fb.auth, email); } catch (x) {}
  gate('signin', 'If that account exists, an email to choose a new password is on its way.', true);
});
$('btnOut').addEventListener('click', () => fb.A.signOut(fb.auth));

/* ---------- the hub ---------- */
function open() {
  gate('off'); $('who').textContent = me.email;
  const h = algiersHour();
  $('hello').textContent = (h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening') + ', ' + FIRST_NAME;
  $('apps').innerHTML = PLATFORMS.map((p, i) => '<a class="app" href="' + p.url + '" target="_blank" rel="noopener" style="--c:' + p.color + '" data-app="' + p.key + '">' +
    '<span class="app-top"><span class="tile"><span>' + svg(p.key) + '</span></span><span><b>' + esc(p.name) + '</b><span class="d">' + esc(p.desc) + '</span></span><span class="go">' + svg('arrow') + '</span></span>' +
    '<span class="app-foot"><span>juniors.academy' + esc(p.url) + '</span><kbd>' + (i + 1) + '</kbd></span></a>').join('');
  const chip = (l, u, c) => '<a class="chip" href="' + u + '" target="_blank" rel="noopener"' + (c ? ' style="--c:' + c + '"' : '') + '>' + (c ? '<i></i>' : svg(/^https:\/\/juniors\.academy\//.test(u) ? 'globe' : 'ext')) + esc(l) + '</a>';
  $('site').innerHTML = SITE.map(x => chip(x[0], x[1])).join('');
  $('services').innerHTML = SERVICES.map(x => chip(x[0], x[1])).join('');
  $('firebase').innerHTML = chip('Firebase console (all projects)', 'https://console.firebase.google.com/') + FIREBASE.map(x => chip(x[0], 'https://console.firebase.google.com/project/' + x[1] + '/overview', x[2])).join('');
  watchDay(); paintDay();
}
/* daily check: saved in the juniors-hq database, so it follows you from laptop to phone; resets every day (Algiers time) */
const docRef = () => fb.F.doc(fb.db, 'hq', 'daily');
function watchDay() {
  try { const l = JSON.parse(localStorage.getItem('hqDaily') || 'null'); if (l && l.day === day) done = l.done || {}; } catch (e) {}
  if (unsub) unsub();
  unsub = fb.F.onSnapshot(docRef(), d => { const v = d.exists() ? d.data() : null; done = v && v.day === day ? (v.done || {}) : {}; keepLocal(); paintDay(); }, () => {});
}
function keepLocal() { try { localStorage.setItem('hqDaily', JSON.stringify({ day, done })); } catch (e) {} }
function paintDay() {
  const n = CHECKS.filter(c => done[c.id]).length, left = CHECKS.length - n;
  const date = new Intl.DateTimeFormat('en-GB', { timeZone: TZ, weekday: 'long', day: 'numeric', month: 'long' }).format(new Date());
  $('today').innerHTML = esc(date) + ' · ' + PLATFORMS.length + ' platforms · <b>' + (left ? left + (left === 1 ? ' check' : ' checks') + ' left today' : 'all checks done today') + '</b>';
  $('dcCount').textContent = n + ' of ' + CHECKS.length + ' done'; $('dcBar').style.width = (n / CHECKS.length * 100) + '%'; $('allDone').hidden = !!left;
  $('checks').innerHTML = CHECKS.map(c => { const p = PLATFORMS.find(x => x.key === c.app), d = !!done[c.id];
    return '<li class="' + (d ? 'done' : '') + '"><button type="button" class="tick" data-check="' + c.id + '" aria-pressed="' + d + '" aria-label="' + esc(c.text) + '">' + svg('check') + '</button>' +
      '<span class="t"><b>' + esc(c.text) + '</b><small>' + esc(c.hint) + '</small></span><a class="open" href="' + p.url + '" target="_blank" rel="noopener" style="--c:' + p.color + '"><span>' + esc(p.name) + '</span>' + svg('ext').replace('class="i"', 'class="i" style="width:13px;height:13px"') + '</a></li>'; }).join('');
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-check]'); if (!t) return;
  const id = t.getAttribute('data-check'); done = Object.assign({}, done, { [id]: !done[id] }); if (!done[id]) delete done[id];
  keepLocal(); paintDay();
  fb.F.setDoc(docRef(), { day, done, by: me.email, at: new Date().toISOString() }).catch(() => {});
});
/* keyboard: 1 to 6 open the platforms */
document.addEventListener('keydown', e => {
  if (!me || e.metaKey || e.ctrlKey || e.altKey || /INPUT|TEXTAREA/.test((e.target.tagName || ''))) return;
  const i = +e.key - 1; if (i >= 0 && i < PLATFORMS.length) window.open(PLATFORMS[i].url, '_blank', 'noopener');
});
/* a new day starts at midnight in Algiers */
setInterval(() => { if (!me) return; const d = algiersDay(); if (d !== day) { day = d; done = {}; keepLocal(); watchDay(); } paintDay(); }, 60000);
start();
</script>
