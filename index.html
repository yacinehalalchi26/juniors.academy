<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>Juniors Academy | Choisissez votre programme</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />

  <style>
    :root {
      --primary:#dc143c;
      --primary-dark:#a00000;
      --neutral:#15151c;
      --neutral-dark:#07070b;
      --text:#ffffff;
    }

    * {
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height:100vh;
      display:flex;
      align-items:flex-start;
      justify-content:center;
      padding:10px 16px 24px;
      color:var(--text);
      text-align:center;
      background:
        radial-gradient(circle at 10% 0%, rgba(220,20,60,.35) 0, transparent 55%),
        radial-gradient(circle at 90% 100%, rgba(160,0,0,.45) 0, transparent 55%),
        radial-gradient(circle at 50% 120%, rgba(255,255,255,.05) 0, transparent 65%),
        linear-gradient(135deg, #020208 0%, #050510 40%, #0a0508 100%);
      background-attachment:fixed;
    }

    body::before {
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      background:
        radial-gradient(circle at top, transparent 0, rgba(0,0,0,.45) 65%),
        radial-gradient(circle at bottom, transparent 0, rgba(0,0,0,.55) 70%);
      mix-blend-mode:normal;
      z-index:-1;
    }

    .shell {
      position:relative;
      max-width:720px;
      width:100%;
      padding:18px 18px 24px;
      border-radius:24px;
      background:linear-gradient(135deg, rgba(10,10,18,.9), rgba(4,4,10,.96));
      box-shadow:
        0 24px 70px rgba(0,0,0,.85),
        0 0 0 1px rgba(255,255,255,.04);
      backdrop-filter:blur(18px);
      -webkit-backdrop-filter:blur(18px);
      margin-top:8px;
    }

    @media (min-width:768px){
      .shell{
        padding:40px 40px 32px;
        border-radius:28px;
        margin-top:40px;
      }
    }

    .logo {
      margin-bottom:18px;
    }

    .logo img {
      max-width:140px;
      height:auto;
      filter:drop-shadow(0 12px 30px rgba(0,0,0,.8));
    }

    @media (min-width:768px){
      .logo img{max-width:180px;}
    }

    .tagline {
      font-size:12px;
      text-transform:uppercase;
      letter-spacing:.22em;
      color:rgba(255,255,255,.55);
      margin-bottom:12px;
    }

    h1 {
      font-size:clamp(22px, 5vw, 34px);
      font-weight:800;
      letter-spacing:.03em;
      margin-bottom:8px;
    }

    p.lead {
      font-size:14px;
      line-height:1.6;
      color:rgba(230,230,235,.9);
      margin-bottom:24px;
    }

    @media (min-width:768px){
      p.lead{font-size:15px;margin-bottom:32px;}
    }

    p.lead strong {
      color:#fff;
      font-weight:700;
    }

    .buttons {
      display:flex;
      gap:14px;
      flex-wrap:wrap;
      justify-content:center;
      margin-bottom:16px;
    }

    @media (min-width:768px){
      .buttons{gap:18px;margin-bottom:26px;}
    }

    .btn {
      position:relative;
      padding:14px 26px;
      border-radius:999px;
      font-size:clamp(14px, 4vw, 17px);
      font-weight:700;
      text-decoration:none;
      color:#fff;
      background:var(--neutral);
      border:1px solid rgba(255,255,255,.12);
      transition:
        background .25s cubic-bezier(.23,1,.32,1),
        box-shadow .25s cubic-bezier(.23,1,.32,1),
        transform .22s cubic-bezier(.23,1,.32,1),
        border-color .25s cubic-bezier(.23,1,.32,1);
      min-width:200px;
      text-align:center;
      box-shadow:0 10px 24px rgba(0,0,0,.7);
      overflow:hidden;
    }

    @media (min-width:768px){
      .btn{
        padding:18px 40px;
        min-width:220px;
      }
    }

    .btn::after{
      content:"";
      position:absolute;
      inset:0;
      opacity:0;
      background:radial-gradient(circle at 50% 0%, rgba(255,255,255,.16), transparent 60%);
      transition:opacity .25s cubic-bezier(.23,1,.32,1);
      pointer-events:none;
    }

    .buttons:hover .btn {
      background:var(--neutral-dark);
      border-color:rgba(255,255,255,.08);
      box-shadow:0 8px 20px rgba(0,0,0,.75);
    }

    .btn:hover {
      background:linear-gradient(135deg, var(--primary), var(--primary-dark)) !important;
      border-color:rgba(255,255,255,.28);
      transform:translateY(-3px);
      box-shadow:0 18px 46px rgba(220,20,60,.65);
    }

    .btn:hover::after{
      opacity:1;
    }

    footer {
      margin-top:6px;
      font-size:12px;
      color:rgba(180,180,190,.75);
    }

    footer a {
      color:var(--primary);
      text-decoration:none;
      border-bottom:1px solid rgba(220,20,60,.4);
    }

    footer a:hover {
      border-bottom-color:#fff;
      color:#fff;
    }
  </style>
</head>

<body>

  <div class="shell">
    <div class="logo">
      <img src="Juniors%20Academy-05.png" alt="Juniors Academy Logo">
    </div>

    <div class="tagline">PROGRAMMES INTERNATIONAUX</div>

    <h1>Bienvenue à Juniors Academy</h1>
    <p class="lead">
      Choisissez votre expérience pour les jeunes de <strong>6 à 18 ans</strong> :
      camps de football de haut niveau ou programmes d’échanges culturels.
    </p>

    <div class="buttons">
      <a href="/football/" class="btn">Football Camps</a>
      <a href="/cultural-exchange/" class="btn">Cultural Exchange Programs</a>
    </div>

    <footer>
      Vous pouvez revenir à cette page à tout moment via
      <a href="https://www.juniors.academy">www.juniors.academy</a>.
    </footer>
  </div>

</body>
</html>
