<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Juniors Academy | Choisissez votre programme</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />

  <style>
    :root {
      --primary:#dc143c;
      --primary-dark:#a00000;
      --neutral:#1a1a1a;
      --neutral-dark:#0f0f0f;
      --text:#fff;
    }

    * {
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Inter, sans-serif;
    }

    body {
      background:#000;
      color:var(--text);
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      height:100vh;
      text-align:center;
      padding:20px;
    }

    /* LOGO */
    .logo {
      margin-bottom:40px;
    }
    .logo img {
      max-width:160px;
      filter:drop-shadow(0 6px 18px rgba(0,0,0,.5));
    }

    /* TITLES */
    h1 {
      font-size:clamp(26px, 5vw, 38px);
      font-weight:800;
      margin-bottom:18px;
    }
    p {
      font-size:15px;
      color:#ccc;
      margin-bottom:40px;
    }

    /* BUTTON CONTAINER */
    .buttons {
      display:flex;
      gap:22px;
      flex-wrap:wrap;
      justify-content:center;
    }

    /* BASE BUTTON STYLE */
    .btn {
      padding:18px 38px;
      border-radius:999px;
      font-size:clamp(15px, 4vw, 18px);
      font-weight:700;
      text-decoration:none;
      color:#fff;
      background:var(--neutral);
      border:1px solid rgba(255,255,255,.1);
      transition:all .25s cubic-bezier(.23,1,.32,1);
      min-width:220px;
      text-align:center;
    }

    /* DEFAULT STATES */
    .btn.active { background:var(--primary); }
    .btn.inactive { background:var(--neutral-dark); }

    /* SWITCH EFFECT ON HOVER */
    .buttons:hover .btn {
      background:var(--neutral-dark);
    }

    .btn:hover {
      background:var(--primary) !important;
      transform:translateY(-3px);
      box-shadow:0 10px 24px rgba(220,20,60,.35);
    }

    footer {
      position:absolute;
      bottom:20px;
      font-size:13px;
      color:#777;
    }
    footer a {
      color:var(--primary);
      text-decoration:none;
    }
  </style>
</head>

<body>

  <div class="logo">
    <img src="Juniors%20Academy-05.png" alt="Juniors Academy Logo">
  </div>

  <h1>Bienvenue à Juniors Academy</h1>
  <p>Choisissez votre programme destiné aux jeunes de <strong>6 à 18 ans</strong>.</p>

  <div class="buttons">
    <a href="/football/" class="btn" id="btnFootball">Football Camps</a>
    <a href="/cultural-exchange/" class="btn" id="btnCultural">Cultural Exchange Programs</a>
  </div>

  <footer>
    Vous pouvez revenir à cette page à tout moment via
    <a href="https://www.juniors.academy">www.juniors.academy</a>.
  </footer>

</body>
</html>
