<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>Juniors Academy | Choisissez votre programme</title>

  <!-- Favicons -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon.png">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />

  <style>
    :root {
      --primary:#dc143c;
      --primary-dark:#a00000;
      --neutral:#15151c;
      --neutral-dark:#07070b;
      --text:#ffffff;
    }

    * {
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height:100vh;
      display:flex;
      align-items:flex-start;
      justify-content:center;

      /* LESS TOP/BOTTOM SPACE here */
      padding:4px 16px 10px;

      color:var(--text);
      text-align:center;

      background:
        radial-gradient(circle at 10% 0%, rgba(220,20,60,.35) 0, transparent 55%),
        radial-gradient(circle at 90% 100%, rgba(160,0,0,.45) 0, transparent 55%),
        radial-gradient(circle at 50% 120%, rgba(255,255,255,.05) 0, transparent 65%),
        linear-gradient(135deg, #020208 0%, #050510 40%, #0a0508 100%);
      background-attachment:fixed;
    }

    body::before {
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      background:
        radial-gradient(circle at top, transparent 0, rgba(0,0,0,.45) 65%),
        radial-gradient(circle at bottom, transparent 0, rgba(0,0,0,.55) 70%);
      z-index:-1;
    }

    .shell {
      position:relative;
      max-width:720px;
      width:100%;

      /* less padding = tighter layout */
      padding:16px 18px 18px;

      border-radius:22px;
      background:linear-gradient(135deg, rgba(10,10,18,.9), rgba(4,4,10,.96));
      box-shadow:
        0 16px 50px rgba(0,0,0,.85),
        0 0 0 1px rgba(255,255,255,.04);
      backdrop-filter:blur(18px);

      /* bring card closer to top */
      margin-top:4px;
    }

    @media (min-width:768px){
      .shell{
        padding:26px 36px 26px;
        margin-top:20px;
      }
    }

    .logo {
      margin-bottom:12px;
    }

    .logo img {
      max-width:140px;
      height:auto;
      filter:drop-shadow(0 12px 30px rgba(0,0,0,.8));
    }

    @media (min-width:768px){
      .logo img{max-width:170px;}
    }

    h1 {
      font-size:clamp(22px, 5vw, 34px);
      font-weight:800;
      letter-spacing:.03em;
      margin-bottom:8px;
    }

    p.lead {
      font-size:14px;
      line-height:1.6;
      color:rgba(230,230,235,.9);

      /* tighten space below */
      margin-bottom:20px;
    }

    @media (min-width:768px){
      p.lead{font-size:15px;margin-bottom:26px;}
    }

    p.lead strong {
      color:#fff;
      font-weight:700;
    }

    .buttons {
      display:flex;
      gap:12px;
      flex-wrap:wrap;
      justify-content:center;

      /* tighter layout */
      margin-bottom:12px;
    }

    @media (min-width:768px){
      .buttons{gap:16px;margin-bottom:20px;}
    }

    .btn {
      position:relative;
      padding:12px 26px;
      border-radius:999px;
      font-size:clamp(14px, 4vw, 17px);
      font-weight:700;
      text-decoration:none;
      color:#fff;
      background:var(--neutral);
      border:1px solid rgba(255,255,255,.12);

      transition:background .25s cubic-bezier(.23,1,.32,1),
                 box-shadow .25s cubic-bezier(.23,1,.32,1),
                 transform .22s cubic-bezier(.23,1,.32,1);

      min-width:200px;
      text-align:center;
      box-shadow:0 8px 20px rgba(0,0,0,.7);
    }

    @media (min-width:768px){
      .btn{
        padding:16px 40px;
        min-width:220px;
      }
    }

    .buttons:hover .btn {
      background:var(--neutral-dark);
    }

    .btn:hover {
      background:linear-gradient(135deg, var(--primary), var(--primary-dark)) !important;
      transform:translateY(-3px);
      box-shadow:0 18px 46px rgba(220,20,60,.65);
    }

    footer {
      margin-top:10px;
      font-size:12px;
      color:rgba(180,180,190,.75);
    }

    /* FLOATING PHONE BUTTON */
    .call-fab{
      position:fixed;
      right:16px;
      bottom:18px;
      z-index:9999;
      width:56px;
      height:56px;
      border-radius:50%;
      display:grid;
      place-items:center;
      background:linear-gradient(135deg,var(--primary),var(--primary-dark));
      box-shadow:0 12px 30px rgba(220,20,60,.4);
      text-decoration:none;
      transition:transform .18s cubic-bezier(.23,1,.32,1);
    }

    .call-fab svg{width:26px;height:26px;fill:#fff;}

    @media (hover:hover){
      .call-fab:hover{
        transform:translateY(-2px);
      }
    }
  </style>
</head>

<body>

  <div class="shell">
    <div class="logo">
      <img src="Juniors%20Academy-05.png" alt="Juniors Academy Logo">
    </div>

    <h1>Bienvenue à Juniors Academy</h1>

    <p class="lead">
      Choisissez votre expérience pour les jeunes de <strong>6 à 18 ans</strong>.
    </p>

    <div class="buttons">
      <a href="/football/" class="btn">Football Camps</a>
      <a href="/cultural-exchange/" class="btn">Cultural Exchange Programs</a>
    </div>

    <footer>
      © 2025 Juniors Academy — Tous droits réservés.<br>
      Revenir à cette page via <a href="https://www.juniors.academy">www.juniors.academy</a>.
    </footer>
  </div>

  <!-- Floating Call Button -->
  <a class="call-fab" href="tel:+213550527722">
    <svg viewBox="0 0 24 24"><path d="M6.62 10.79a15.05 15.05 0 006.59 6.59l2.2-2.2a1 1 0 011.02-.24c1.12.37 2.33.57 3.57.57a1 1 0 011 1v3.5a1 1 0 01-1 1C10.4 21.02 2.98 13.6 2.98 4a1 1 0 011-1H7.5a1 1 0 011 1c0 1.24.2 2.45.57 3.57a1 1 0 01-.24 1.02l-2.2 2.2z"/></svg>
  </a>

</body>
</html>
