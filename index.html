  <style>
    :root{
      --primary:#dc143c;
      --primary-dark:#a00000;
      --gray:#8a8a8e;
      --card-bg:rgba(255,255,255,.08);
      --elev:0 10px 30px rgba(0,0,0,.18);
      --elev-2:0 18px 50px rgba(0,0,0,.35);
      --t:cubic-bezier(.23,1,.32,1);
      --radius-xl:22px;

      --hero-logo-h:200px;
      --hero-logo-h-sm:150px;
    }
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{width:100%;overflow-x:hidden;touch-action:manipulation}
    html{scroll-behavior:smooth}
    body{
      font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial,"Noto Sans";
      line-height:1.6;background:#000;color:#fff;
      background: radial-gradient(circle at 50% 50%, #1a1a1a 0%, #000 100%);
      -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
    }

    .top-banner{
      text-align:center;background:linear-gradient(135deg,var(--primary),var(--primary-dark));
      padding:12px 0;position:relative;z-index:10;box-shadow:0 2px 10px rgba(0,0,0,.25)
    }
    .top-banner p{font-style:italic;font-size:14px;color:#fff;letter-spacing:.5px}

    /* Floating Call Button */
    .call-fab{
      position:fixed;right:16px;bottom:16px;z-index:9999;
      width:56px;height:56px;border-radius:50%;display:grid;place-items:center;
      background:linear-gradient(135deg,var(--primary),var(--primary-dark));
      box-shadow:0 12px 30px rgba(220,20,60,.4);
      text-decoration:none;transition:transform .18s var(--t), box-shadow .18s var(--t);
    }
    .call-fab svg{width:26px;height:26px;display:block;fill:#fff}

    /* Hero */
    .hero{
      position:relative;
      min-height:100svh;
      display:grid;place-items:center;overflow:hidden;padding:0 16px
    }
    .hero-bg{
      position:absolute;inset:0;z-index:-1;
      background:
        linear-gradient(rgba(0,0,0,.62), rgba(0,0,0,.88)),
        url('https://juniors.academy/Arsenal%201.png')
        no-repeat center center / cover;
    }

    /* BLOG + NEW BUTTON */
    .blog-pill{
      position:absolute;
      top:16px;
      left:16px;
      z-index:3;
      display:flex;
      flex-direction:column;
      gap:10px;
    }
    .blog-pill a{
      color:#fff;font-weight:700;text-decoration:none;
      background:linear-gradient(135deg,var(--primary),var(--primary-dark));
      padding:8px 16px;border-radius:999px;
      box-shadow:0 4px 12px rgba(220,20,60,.4);
    }

    .hero-logo{
      position:absolute;left:50%;transform:translateX(-50%);
      top:calc(env(safe-area-inset-top, 0px) + 8px);
      z-index:2;
    }

    .hero-logo img{
      max-height:var(--hero-logo-h);width:auto;
      filter:drop-shadow(0 10px 28px rgba(0,0,0,.5));
    }

    .hero-content{text-align:center;max-width:1100px;margin:0 auto;padding-top:calc(var(--hero-logo-h) * 1.1)}

    .hero-headline{
      font-size:clamp(28px, 6vw, 64px);font-weight:800;line-height:1.06;margin:6px auto 12px;
      background:linear-gradient(to right,#fff,#f0f0f0);-webkit-background-clip:text;-webkit-text-fill-color:transparent;
    }
    .hero-subhead{
      font-size:clamp(14px, 3.6vw, 22px);color:rgba(255,255,255,.9);max-width:920px;margin:0 auto 10px;line-height:1.55
    }
    .one-line{
      white-space:nowrap;overflow:hidden;text-overflow:clip;
      font-weight:900;margin:8px auto 14px;font-size:clamp(12px, 3.6vw, 26px);letter-spacing:-0.2px;
    }

    .hero-cta{
      display:inline-flex;align-items:center;justify-content:center;gap:10px;
      font-weight:900;letter-spacing:.3px;color:#fff;text-decoration:none;border:none;cursor:pointer;
      padding:16px 36px;font-size:clamp(15px,4.5vw,20px);
      border-radius:999px;
      background-image:linear-gradient(135deg,#ff3555,#dc143c,#a00000);
      background-size:200% 100%;
      box-shadow:0 12px 34px rgba(220,20,60,.45);
      transition:transform .18s var(--t), box-shadow .18s var(--t), background-position .25s var(--t);
      margin:22px auto 44px;
    }

    /* Carousel */
    .hero-carousel{margin:0 auto;max-width:900px;width:100%;
      border-radius:16px;overflow:hidden;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04)}
    .carousel-viewport{position:relative;aspect-ratio:4945/3295;max-height:380px}

    .carousel-track{display:flex;width:100%;height:100%;transition:transform .5s var(--t)}
    .carousel-slide{flex:0 0 100%}
    .carousel-slide img{width:100%;height:100%;object-fit:cover;display:block}

    .carousel-dots{display:flex;gap:8px;justify-content:center;padding:10px}
    .carousel-dots button{width:8px;height:8px;border-radius:50%;border:none;background:rgba(255,255,255,.35)}

    /* Sections */
    section{content-visibility:auto;contain-intrinsic-size:600px}

    /* Services */
    .services{padding:64px 16px;max-width:1200px;margin:0 auto}

    .section-header{text-align:center;margin-bottom:28px}
    .section-title--nowrap{white-space:nowrap}

    .section-title{
      display:inline-block;color:#fff;font-size:clamp(18px,4.6vw,26px);
      font-weight:900;text-transform:uppercase;letter-spacing:.6px;line-height:1.2;
      position:relative;
    }

    .section-title::after{
      content:"";position:absolute;left:50%;bottom:-10px;
      width:70%;height:3px;background:var(--primary);
      transform:translateX(-50%) scaleX(0);transform-origin:center;
      transition:transform .6s var(--t);
    }

    .section-subtitle{font-size:clamp(13px,3.4vw,16px);color:var(--gray);max-width:740px;margin:14px auto 0}

    .services-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:22px}

    .service-card{
      background:var(--card-bg);border-radius:var(--radius-xl);padding:22px;text-align:center;
      border:1px solid rgba(255,255,255,.06);box-shadow:var(--elev);backdrop-filter:blur(10px)
    }
    .service-icon{font-size:36px;margin-bottom:12px;color:var(--primary)}
    .service-card h3{font-weight:800;font-size:16px;margin-bottom:8px;text-transform:uppercase}
    .service-card p{color:rgba(255,255,255,.78);font-size:14px}

    /* Partner */
    .partner-section{padding:60px 16px;text-align:center}
    .partner-title{font-size:clamp(16px,3.6vw,20px);font-weight:700;margin-bottom:22px}

    /* Contact */
    .contact-section{padding:64px 16px;max-width:1000px;margin:0 auto}

    .contact-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}

    footer.footer{background:rgba(0,0,0,.85);padding:30px 16px;text-align:center}

  </style>
</head>
