<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Juniors Academy – Accueil</title>
<link rel="icon" type="image/png" href="favicon.png" />

<style>
:root{
  --primary:#dc143c;
  --primary-dark:#a00000;
  --glass-bg:rgba(255,255,255,0.12);
  --glass-border:rgba(255,255,255,0.28);
}

*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui;-webkit-tap-highlight-color:transparent}
body,html{height:100%;overflow:hidden}

/* GRID LAYOUT */
.wrapper{
  position:relative;
  height:100vh;
  width:100vw;
  display:flex;
  overflow:hidden;
}

.panel{
  flex:1;
  position:relative;
  cursor:pointer;
  overflow:hidden;
  transition:flex .6s cubic-bezier(.23,1,.32,1);
}

.panel:hover{
  flex:1.3;
}

/* BACKGROUNDS */
.panel-left{
  background:url("Arsenal 4.png") center/cover no-repeat;
}
.panel-right{
  background:url("Beijing1.jpg") center/cover no-repeat;
}

/* DARK OVERLAY + ANIMATION */
.panel::before{
  content:"";
  position:absolute;inset:0;
  background:rgba(0,0,0,0.45);
  transition:background .4s;
}
.panel:hover::before{
  background:rgba(0,0,0,0.25);
}

/* INNER GLASS CARD (APPLE STYLE) */
.panel-inner{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%) translateY(30px);
  opacity:0;
  text-align:center;
  padding:26px 18px 24px;
  width:75%;
  max-width:380px;

  /* 🍎 LIQUID GLASS */
  background:var(--glass-bg);
  border:1px solid var(--glass-border);
  backdrop-filter:blur(22px) saturate(140%);
  -webkit-backdrop-filter:blur(22px) saturate(140%);
  border-radius:22px;
  box-shadow:
    0 12px 40px rgba(0,0,0,0.55),
    inset 0 0 6px rgba(255,255,255,0.25);

  transition:opacity .5s ease, transform .5s ease;
}

.panel:hover .panel-inner{
  transform:translate(-50%,-50%) translateY(0);
  opacity:1;
}

/* MOBILE: animate always visible */
@media (max-width:768px){
  .panel-inner{
    opacity:1 !important;
    transform:translate(-50%,-50%) !important;
    width:88%;
  }
}

.panel-inner h2{
  font-size:clamp(24px,6vw,38px);
  font-weight:800;
  color:#fff;
  letter-spacing:1px;
  margin-bottom:4px;
  text-transform:uppercase;
}

.panel-inner p{
  font-size:clamp(14px,4vw,18px);
  color:rgba(255,255,255,0.88);
  margin-bottom:18px;
  text-transform:uppercase;
  letter-spacing:.5px;
}

.panel-inner a{
  display:inline-block;
  padding:12px 26px;
  font-size:clamp(14px,4vw,16px);
  font-weight:700;
  text-decoration:none;
  color:#fff;
  border-radius:999px;
  background:linear-gradient(135deg,var(--primary),var(--primary-dark));
  box-shadow:0 10px 30px rgba(220,20,60,.45);
  transition:transform .2s, box-shadow .2s;
}

.panel-inner a:hover{
  transform:translateY(-2px);
  box-shadow:0 16px 42px rgba(220,20,60,.55);
}

/* PHONE BUTTON */
.call-fab{
  position:fixed;
  right:16px;
  bottom:16px;
  width:56px;height:56px;
  border-radius:50%;
  display:grid;place-items:center;
  background:linear-gradient(135deg,var(--primary),var(--primary-dark));
  box-shadow:0 12px 30px rgba(220,20,60,.4);
  text-decoration:none;
  z-index:999;
}
.call-fab svg{width:26px;height:26px;fill:#fff}

/* TITLE */
.main-title{
  position:absolute;
  top:38px;
  left:50%;
  transform:translateX(-50%);
  text-align:center;
  color:#fff;
  text-shadow:0 4px 14px rgba(0,0,0,0.5);
  z-index:20;
}

.main-title h1{
  font-size:clamp(30px,7vw,60px);
  font-weight:800;
  letter-spacing:.5px;
  background:linear-gradient(to right,#fff,#dcdcdc);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  margin-bottom:8px;
}

/* COPYRIGHT */
.footer{
  position:absolute;
  bottom:6px;
  width:100%;
  text-align:center;
  color:rgba(255,255,255,0.6);
  font-size:13px;
  padding-bottom:6px;
}
</style>
</head>

<body>

<!-- TITLE -->
<div class="main-title">
  <h1>Bienvenue à<br class="mobile-break"> Juniors Academy</h1>
</div>

<!-- SPLIT PANELS -->
<div class="wrapper">

  <!-- LEFT: SPORTS → FOOTBALL -->
  <div class="panel panel-left" onclick="location.href='football.html'">
    <div class="panel-inner">
      <h2>Sports</h2>
      <p>Football</p>
      <a href="football.html">Accéder</a>
    </div>
  </div>

  <!-- RIGHT: CULTURAL → EXCHANGE -->
  <div class="panel panel-right" onclick="location.href='cultural-exchange.html'">
    <div class="panel-inner">
      <h2>Cultural</h2>
      <p>Exchange</p>
      <a href="cultural-exchange.html">Accéder</a>
    </div>
  </div>

</div>

<!-- PHONE CALL BUTTON -->
<a class="call-fab" href="tel:+213550527722">
  <svg viewBox="0 0 24 24"><path d="M6.62 10.79a15.05 15.05 0 006.59 6.59l2.2-2.2a1 1 0 011.02-.24c1.12.37 2.33.57 3.57.57a1 1 0 011 1v3.5a1 1 0 01-1 1C10.4 21.02 2.98 13.6 2.98 4a1 1 0 011-1H7.5a1 1 0 011 1c0 1.24.2 2.45.57 3.57a1 1 0 01-.24 1.02l-2.2 2.2z"/></svg>
</a>

<!-- COPYRIGHT -->
<div class="footer">© 2025 Juniors Academy. Tous droits réservés.</div>

</body>
</html>
