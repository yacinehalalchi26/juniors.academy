<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Juniors Academy | Choisissez votre programme</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet" />

  <style>
    :root {
      --primary:#dc143c;
      --primary-dark:#a00000;
      --gray:#bfbfbf;
    }

    * {
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Inter, sans-serif;
    }

    html, body {
      height:100%;
      overflow:hidden; /* 🔥 BLOCK ALL SCROLL */
      overscroll-behavior:none; /* 🔥 Stop iOS bouncing */
      touch-action:none; /* 🔥 Prevent drag movement */
    }

    body {
      display:flex;
      flex-direction:column;
      justify-content:space-between;
      background: radial-gradient(circle at 50% 20%, #3a0a14, #120205 60%, #000 100%);
      color:#fff;
      -webkit-font-smoothing:antialiased;
    }

    /* Logo Positioned Top */
    .logo-box {
      width:100%;
      text-align:center;
      padding-top:10px; /* reduced spacing */
      flex-shrink:0;
    }
    .logo-box img {
      width:150px;
      height:auto;
    }

    /* Main Wrapper */
    .wrapper {
      flex-grow:1;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      padding:20px;
      text-align:center;
    }

    /* Title */
    h1 {
      font-size:clamp(26px, 6vw, 48px);
      font-weight:800;
      margin-bottom:20px;
      line-height:1.2;
    }

    .mobile-break { display:none; }
    @media (max-width:480px) {
      .mobile-break { display:block; }
    }

    /* Buttons */
    .options {
      display:flex;
      flex-direction:column;
      gap:18px;
      width:100%;
      max-width:380px;
      margin-top:20px;
    }

    .option-btn {
      padding:18px;
      border-radius:14px;
      font-size:clamp(18px, 4.5vw, 24px);
      font-weight:700;
      cursor:pointer;
      text-decoration:none;
      color:#fff;
      transition:0.25s ease;
      background:#1a1a1a;
      border:1px solid rgba(255,255,255,0.12);
      display:block;
      user-select:none;
    }

    .option-btn:hover {
      background:linear-gradient(135deg, var(--primary), var(--primary-dark));
      transform:translateY(-3px);
      box-shadow:0 8px 20px rgba(220,20,60,0.45);
    }

    .options:hover .option-btn {
      background:#111;
      opacity:0.7;
    }
    .options:hover .option-btn:hover {
      opacity:1;
    }

    /* Footer */
    footer {
      text-align:center;
      padding:12px 0;
      font-size:14px;
      color:var(--gray);
      flex-shrink:0;
    }

    /* Floating Call Button */
    .call-fab{
      position:fixed;
      right:16px;
      bottom:16px;
      z-index:999;
      width:56px;height:56px;
      border-radius:50%;
      display:grid;place-items:center;
      background:linear-gradient(135deg,var(--primary),var(--primary-dark));
      box-shadow:0 12px 30px rgba(220,20,60,.45);
      text-decoration:none;
      transition:0.2s ease;
      user-select:none;
    }
    .call-fab svg{
      width:26px;height:26px;fill:#fff;
    }
    .call-fab:active{transform:scale(.97);}
  </style>
</head>

<body>

  <!-- Logo -->
  <div class="logo-box">
    <img src="Juniors Academy-05.png" alt="Juniors Academy">
  </div>

  <!-- Content -->
  <div class="wrapper">
    <h1>
      Bienvenue à <br class="mobile-break"> Juniors Academy
    </h1>

    <div class="options">
      <a href="/football" class="option-btn">Football Camps</a>
      <a href="/cultural-exchange" class="option-btn">Cultural Exchange Programs</a>
    </div>

  </div>

  <!-- Call Button -->
  <a class="call-fab" href="tel:+213550527722">
    <svg viewBox="0 0 24 24"><path d="M6.62 10.79a15.05 15.05 0 006.59 6.59l2.2-2.2a1 1 0 011.02-.24c1.12.37 2.33.57 3.57.57a1 1 0 011 1v3.5a1 1 0 01-1 1C10.4 21.02 2.98 13.6 2.98 4a1 1 0 011-1H7.5a1 1 0 011 1c0 1.24.2 2.45.57 3.57a1 1 0 01-.24 1.02l-2.2 2.2z"/></svg>
  </a>

  <!-- Footer -->
  <footer>
    © 2025 Juniors Academy. Tous droits réservés.
  </footer>

</body>
</html>
