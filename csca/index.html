       Firebase project juniors-csca. Students never see a score: only the director does.
       The question bank is imported by the director from a private file (never put it on GitHub).
       ============================================================ */
    :root {
      /* Juniors Academy brand, v1.0 (purple-led). Only these eight colours, plus tints of them. */
      --ja-purple: #4A235A; --ja-crimson: #DC143C; --ja-paper: #FAFAF7; --ja-ink: #14101A;
      --ja-night: #2B1236; --ja-lavender: #EDE9EE; --ja-blush: #FCE8EC; --ja-sun: #FFC23D;
      --ja-prism: conic-gradient(#4A235A 0deg, #7A2166 45deg, #B31A4E 90deg, #DC143C 135deg, #F2683E 180deg, #FFC23D 225deg, #F0A08F 270deg, #B4708F 315deg, #4A235A 360deg);
      --slant: skewX(-20deg);
      --muted: rgba(20,16,26,.6); --body: rgba(20,16,26,.8); --line: rgba(74,35,90,.16);
      --ease: cubic-bezier(.16, 1, .3, 1);
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body { margin: 0; background: var(--ja-paper); color: var(--ja-ink); font-family: 'Poppins', 'Cairo', system-ui, -apple-system, sans-serif; font-size: 14.5px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
    button, input, select { font: inherit; color: inherit; }
    button { cursor: pointer; }
    :focus-visible { outline: 3px solid var(--ja-purple); outline-offset: 2px; border-radius: 6px; }
    [hidden] { display: none !important; }
    .num { font-variant-numeric: tabular-nums; }
    svg.i { width: 18px; height: 18px; flex: none; }
    [lang="zh"], .zh { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Poppins', sans-serif; }

    /* the prism mark */
    .mark { flex: none; width: 34px; height: 34px; border-radius: 50%; padding: 3px; background: var(--ja-prism); display: grid; place-items: center; }
    .mark span { width: 100%; height: 100%; border-radius: 50%; background: var(--ja-purple); display: grid; place-items: center; color: #fff; }
    .mark svg { width: 55%; height: auto; display: block; }

    /* header */
    .top { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 12px; padding: 10px clamp(12px, 3vw, 28px); padding-top: calc(10px + env(safe-area-inset-top, 0px)); background: var(--ja-purple); color: #fff; }
    .top b { font-size: 1.05rem; font-weight: 600; }
    .top small { display: block; font-size: .72rem; color: rgba(255,255,255,.62); line-height: 1.2; }
    .tabs { display: flex; gap: 4px; margin-left: 16px; }
    .tabs button { min-height: 38px; padding: 6px 14px; border: 0; background: none; color: rgba(255,255,255,.7); font-weight: 600; font-size: .88rem; box-shadow: inset 0 -4px 0 transparent; }
    .tabs button:hover { color: #fff; }
    .tabs button[aria-pressed="true"] { color: #fff; box-shadow: inset 0 -4px 0 var(--ja-sun); }
    .top .sp { flex: 1; }
    .who { text-align: right; font-size: .78rem; color: rgba(255,255,255,.65); line-height: 1.25; white-space: nowrap; }
    .who b { display: block; color: #fff; font-size: .86rem; }
    .tbtn { min-height: 34px; padding: 5px 13px; border-radius: 6px; border: 1px solid rgba(255,255,255,.28); background: rgba(255,255,255,.08); color: #fff; font-weight: 600; font-size: .84rem; white-space: nowrap; }
    .tbtn:hover { background: rgba(255,255,255,.18); }

    .wrap { max-width: 1180px; margin: 0 auto; padding: 24px clamp(12px, 3vw, 28px) 70px; }
    .head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px 20px; flex-wrap: wrap; margin: 0 0 18px; }
    h1.page { margin: 0; font-size: clamp(1.5rem, 2.8vw, 2.1rem); font-weight: 700; font-style: italic; text-transform: uppercase; letter-spacing: -.015em; line-height: 1.08; color: var(--ja-purple); }
    h1.page::after { content: ""; display: block; width: 56px; height: 4px; background: var(--ja-sun); margin-top: 10px; }
    .head p { margin: 8px 0 0; color: var(--muted); max-width: 70ch; }

    /* buttons: the slant */
    .btn { position: relative; isolation: isolate; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 8px 18px; border: 0; background: transparent; font-weight: 600; font-size: .9rem; white-space: nowrap; text-decoration: none; }
    .btn::before { content: ""; position: absolute; inset: 0; z-index: -1; transform: var(--slant); border-radius: 4px; transition: background .15s; }
    .btn:disabled { opacity: .55; cursor: default; }
    .btn-main { color: #fff; } .btn-main::before { background: var(--ja-purple); } .btn-main:hover::before { background: var(--ja-night); }
    .btn-light { color: var(--ja-purple); } .btn-light::before { background: #fff; box-shadow: inset 0 0 0 1.5px var(--line); } .btn-light:hover::before { background: var(--ja-lavender); }
    .btn-red { color: var(--ja-crimson); } .btn-red::before { background: #fff; box-shadow: inset 0 0 0 1.5px rgba(220,20,60,.4); } .btn-red:hover::before { background: var(--ja-blush); }
    .btn-small { min-height: 34px; padding: 5px 14px; font-size: .84rem; }
    .btn-big { min-height: 50px; padding: 12px 28px; font-size: 1rem; }
    .linkish { background: none; border: 0; padding: 0; color: var(--ja-purple); font-weight: 600; font-size: .86rem; text-decoration: underline; }

    /* chips (slanted behind straight text) */
    .chip { position: relative; isolation: isolate; display: inline-flex; align-items: center; gap: 6px; padding: 2px 11px; font-size: .74rem; font-weight: 700; white-space: nowrap; color: var(--ja-purple); }
    .chip::before { content: ""; position: absolute; inset: 0; z-index: -1; background: var(--cb, var(--ja-lavender)); transform: var(--slant); border-radius: 3px; }
    .chip.done { --cb: var(--ja-purple); color: #fff; } .chip.run { --cb: var(--ja-sun); color: var(--ja-ink); } .chip.off { --cb: rgba(20,16,26,.07); color: var(--muted); } .chip.bad { --cb: var(--ja-blush); color: var(--ja-ink); }

    .card { background: #fff; border: 1px solid var(--line); border-radius: 12px; }
    .pad { padding: 16px 18px; }
    .h { margin: 0 0 12px; font-size: 1.02rem; font-weight: 600; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .h small { font-weight: 500; font-size: .8rem; color: var(--muted); }
    .muted { color: var(--muted); }

    /* stats */
    .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin: 0 0 16px; }
    .stat { padding: 14px 16px; border-radius: 10px; background: #fff; border: 1px solid var(--line); }
    .stat b { display: block; font-size: clamp(1.35rem, 2.2vw, 1.8rem); font-weight: 700; font-style: italic; line-height: 1.05; }
    .stat span { display: block; margin-top: 3px; font-size: .8rem; color: var(--muted); }
    .stat.dark { background: var(--ja-purple); border-color: var(--ja-purple); color: #fff; } .stat.dark b { color: var(--ja-sun); } .stat.dark span { color: rgba(255,255,255,.7); }

    /* student home */
    .hello { position: relative; overflow: hidden; margin: 0 0 18px; padding: 22px 24px; border-radius: 12px; background: var(--ja-purple); color: #fff; }
    .hello h1 { margin: 0 0 6px; font-size: clamp(1.4rem, 2.6vw, 1.9rem); font-weight: 700; font-style: italic; text-transform: uppercase; letter-spacing: -.015em; }
    .hello h1::after { content: ""; display: block; width: 56px; height: 4px; background: var(--ja-sun); margin-top: 8px; }
    .hello p { margin: 0; color: rgba(255,255,255,.8); max-width: 62ch; }
    .subj { margin: 22px 0 10px; display: flex; align-items: center; gap: 10px; font-size: 1rem; font-weight: 600; }
    .subj em { font-style: normal; font-weight: 500; color: var(--muted); font-size: .86rem; }
    .tests { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
    .test { display: flex; flex-direction: column; gap: 8px; padding: 16px 18px; border-radius: 10px; background: #fff; border: 1px solid var(--line); }
    .test b { font-weight: 600; font-size: 1rem; }
    .test .meta { font-size: .82rem; color: var(--muted); }
    .test .foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: auto; padding-top: 6px; }
    .empty { text-align: center; padding: 44px 20px; background: #fff; border: 1px solid var(--line); border-radius: 12px; }
    .empty h2 { margin: 10px 0 6px; font-size: 1.2rem; font-weight: 600; }
    .empty p { margin: 0 auto; max-width: 52ch; color: var(--muted); }

    /* intro */
    .intro { max-width: 760px; margin: 0 auto; }
    .rules { list-style: none; margin: 14px 0 18px; padding: 0; display: grid; gap: 9px; }
    .rules li { position: relative; padding-left: 24px; }
    .rules li::before { content: ""; position: absolute; left: 3px; top: .5em; width: 12px; height: 11px; background: var(--ja-purple); clip-path: polygon(50% 0, 100% 100%, 0 100%); }
    .facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin: 0 0 16px; }
    .fact { padding: 12px 14px; border-radius: 10px; background: var(--ja-lavender); }
    .fact b { display: block; font-size: 1.35rem; font-weight: 700; font-style: italic; color: var(--ja-purple); line-height: 1.1; }
    .fact span { font-size: .8rem; color: var(--body); }
    .ready { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; background: #fff; border: 1px solid var(--line); border-radius: 10px; margin: 0 0 16px; font-size: .9rem; cursor: pointer; }
    .ready input { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--ja-purple); flex: none; }

    /* ==================== the exam (a copy of the official CBT screen) ==================== */
    .exam { position: fixed; inset: 0; z-index: 100; display: grid; grid-template-rows: auto 1fr; background: var(--ja-paper); }
    .ebar { display: flex; align-items: center; gap: 14px; padding: 8px clamp(10px, 2vw, 22px); padding-top: calc(8px + env(safe-area-inset-top, 0px)); background: var(--ja-purple); color: #fff; }
    .ebar .t { min-width: 0; }
    .ebar .t b { display: block; font-weight: 600; font-size: .98rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ebar .t small { display: block; font-size: .74rem; color: rgba(255,255,255,.65); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .timer { flex: none; margin-left: auto; display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 6px; background: var(--ja-night); font-weight: 700; font-size: 1.12rem; font-variant-numeric: tabular-nums; letter-spacing: .02em; }
    .timer small { font-size: .7rem; font-weight: 600; color: rgba(255,255,255,.65); letter-spacing: 0; }
    .timer.warn { background: var(--ja-sun); color: var(--ja-ink); } .timer.warn small { color: rgba(20,16,26,.7); }
    .timer.crit { background: #fff; color: var(--ja-crimson); animation: blink 1s steps(2) infinite; } .timer.crit small { color: var(--ja-crimson); }
    @keyframes blink { 50% { opacity: .55; } }
    .saved { flex: none; font-size: .74rem; color: rgba(255,255,255,.7); display: inline-flex; align-items: center; gap: 6px; }
    .saved i { width: 8px; height: 8px; border-radius: 50%; background: var(--ja-sun); }
    .saved.busy i { background: rgba(255,255,255,.5); } .saved.err i { background: #fff; } .saved.err { color: #fff; font-weight: 600; }
    .ebar .btn-sub { color: var(--ja-ink); } .ebar .btn-sub::before { background: var(--ja-sun); } .ebar .btn-sub:hover::before { background: #fff; }
    .ebody { display: grid; grid-template-columns: minmax(0, 1fr) 300px; min-height: 0; }
    .qpane { min-height: 0; overflow-y: auto; padding: 18px clamp(12px, 3vw, 34px) 30px; }
    .sect { margin: 0 0 14px; padding: 10px 14px; border-radius: 10px; background: var(--ja-lavender); }
    .sect b { display: block; font-weight: 700; color: var(--ja-purple); }
    .sect span { display: block; font-size: .86rem; color: var(--body); }
    .qwrap { display: grid; gap: 16px; }
    .qwrap.split { grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); align-items: start; }
    .passage { padding: 14px 16px; border-radius: 10px; background: #fff; border: 1px solid var(--line); font-size: 1.02rem; line-height: 1.95; white-space: pre-wrap; max-height: calc(100vh - 210px); overflow-y: auto; }
    .passage b.gap { color: var(--ja-purple); }
    .qno { display: flex; align-items: center; gap: 10px; margin: 0 0 8px; font-weight: 700; color: var(--ja-purple); }
    .qno .chip { font-size: .7rem; }
    .qtext { margin: 0 0 16px; font-size: calc(1.06rem * var(--fs, 1)); line-height: 1.7; white-space: pre-wrap; overflow-wrap: anywhere; }
    .opts { display: grid; gap: 9px; }
    .opt { display: flex; align-items: flex-start; gap: 12px; width: 100%; padding: 11px 14px; border-radius: 10px; border: 1.5px solid var(--line); background: #fff; text-align: left; font-size: calc(1rem * var(--fs, 1)); line-height: 1.55; transition: border-color .15s, background .15s; }
    .opt:hover { border-color: rgba(74,35,90,.45); }
    .opt i { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-weight: 700; font-size: .86rem; border: 1.5px solid rgba(74,35,90,.35); color: var(--ja-purple); }
    .opt span { padding-top: 2px; overflow-wrap: anywhere; }
    .opt[aria-pressed="true"] { border-color: var(--ja-purple); background: var(--ja-lavender); }
    .opt[aria-pressed="true"] i { background: var(--ja-purple); border-color: var(--ja-purple); color: #fff; }
    .qnav { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 22px; }
    .qnav .sp { flex: 1; }
    .flagbtn[aria-pressed="true"] { color: var(--ja-ink); } .flagbtn[aria-pressed="true"]::before { background: var(--ja-sun); box-shadow: none; }
    .sheet { min-height: 0; overflow-y: auto; border-left: 1px solid var(--line); background: #fff; padding: 16px; }
    .sheet h3 { margin: 0 0 4px; font-size: .92rem; font-weight: 600; }
    .counts { display: flex; gap: 12px; font-size: .78rem; color: var(--muted); margin: 0 0 10px; }
    .counts b { color: var(--ja-ink); }
    .legend { display: grid; grid-template-columns: 1fr 1fr; gap: 5px 10px; margin: 0 0 14px; font-size: .74rem; color: var(--muted); }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .legend i { width: 14px; height: 14px; border-radius: 3px; border: 1.5px solid var(--line); background: #fff; position: relative; flex: none; }
    .sgroup { margin: 0 0 12px; }
    .sgroup small { display: block; margin: 0 0 5px; font-size: .72rem; font-weight: 600; color: var(--body); }
    .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; }
    .cell { position: relative; height: 34px; border-radius: 6px; border: 1.5px solid var(--line); background: #fff; font-size: .8rem; font-weight: 600; color: var(--body); padding: 0; }
    .cell.ans, .legend i.ans { background: var(--ja-purple); border-color: var(--ja-purple); color: #fff; }
    .cell.flag::after, .legend i.flag::after { content: ""; position: absolute; top: -1.5px; right: -1.5px; width: 0; height: 0; border-top: 11px solid var(--ja-sun); border-left: 11px solid transparent; border-top-right-radius: 5px; }
    .cell.cur, .legend i.cur { box-shadow: 0 0 0 2.5px var(--ja-sun); }
    .sheet .btn { width: 100%; margin-top: 8px; }
    .sheetbtn { display: none; }
    .fs { display: inline-flex; gap: 2px; }
    .fs button { min-width: 32px; min-height: 30px; border-radius: 6px; border: 1px solid rgba(255,255,255,.28); background: rgba(255,255,255,.08); color: #fff; font-weight: 700; font-size: .76rem; }
    .done { max-width: 560px; margin: 8vh auto 0; text-align: center; }
    .done .mark { width: 64px; height: 64px; margin: 0 auto 16px; }
    .done h1 { margin: 0 0 10px; font-size: clamp(1.4rem, 3vw, 1.9rem); font-weight: 700; font-style: italic; text-transform: uppercase; color: var(--ja-purple); }
    .done p { color: var(--body); }

    /* tables (director) */
    .bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 0 0 12px; }
    .bar input[type=search], .bar select { min-height: 38px; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--line); background: #fff; font-size: .86rem; }
    .bar input[type=search] { flex: 1; min-width: 200px; }
    .twrap { background: #fff; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
    .tscroll { overflow-x: auto; }
    table.list { width: 100%; border-collapse: collapse; min-width: 760px; }
    .list th { text-align: left; font-size: .74rem; font-weight: 600; color: var(--muted); padding: 11px 12px; border-bottom: 1px solid var(--line); background: var(--ja-paper); white-space: nowrap; }
    .list td { padding: 11px 12px; border-bottom: 1px solid var(--line); font-size: .87rem; vertical-align: middle; }
    .list tr:last-child td { border-bottom: 0; }
    .list tbody tr.go { cursor: pointer; } .list tbody tr.go:hover { background: rgba(237,233,238,.55); }
    .list td small { display: block; color: var(--muted); font-size: .76rem; }
    .score { font-size: 1.15rem; font-weight: 700; font-style: italic; color: var(--ja-purple); }
    .score.low { color: var(--ja-crimson); }
    .tbar { display: flex; align-items: center; gap: 10px; font-size: .84rem; }
    .tbar span.n { flex: 0 0 42%; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tbar span.track { flex: 1; height: 8px; border-radius: 999px; background: var(--ja-lavender); overflow: hidden; }
    .tbar span.track i { display: block; height: 100%; background: var(--ja-purple); border-radius: inherit; }
    .tbar span.track i.low { background: var(--ja-crimson); }
    .tbar b { flex: 0 0 64px; text-align: right; font-variant-numeric: tabular-nums; }
    .tbars { display: grid; gap: 8px; }
    .weak { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 0; }

    /* dialogs */
    dialog.pop { border: 0; padding: 0; border-radius: 12px; width: min(640px, calc(100vw - 24px)); max-height: calc(100dvh - 24px); background: var(--ja-paper); color: var(--ja-ink); box-shadow: 0 40px 90px -20px rgba(43,18,54,.5); }
    dialog.pop.wide { width: min(980px, calc(100vw - 24px)); }
    dialog.pop::backdrop { background: rgba(43,18,54,.55); }
    .pop-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 18px; background: var(--ja-purple); color: #fff; position: sticky; top: 0; z-index: 2; }
    .pop-head h2 { margin: 0; font-size: 1.08rem; font-weight: 600; }
    .pop-head p { margin: 1px 0 0; font-size: .8rem; color: rgba(255,255,255,.65); }
    .x { width: 38px; height: 38px; border-radius: 50%; border: 1px solid rgba(255,255,255,.3); background: transparent; color: #fff; font-size: 1.25rem; line-height: 1; flex: none; }
    .pop-body { display: grid; gap: 14px; padding: 18px; }
    .pop-foot { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
    .fld { display: grid; gap: 4px; }
    .fld label { font-size: .76rem; font-weight: 600; color: var(--body); }
    .fld input { width: 100%; min-height: 42px; padding: 8px 12px; border-radius: 8px; border: 1px solid rgba(74,35,90,.22); background: #fff; }
    .fld input:focus { outline: none; border-color: var(--ja-purple); box-shadow: 0 0 0 3px var(--ja-lavender); }
    .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .err { margin: 0; padding: 10px 12px; border-radius: 8px; background: var(--ja-blush); color: var(--ja-ink); font-size: .86rem; font-weight: 500; }
    .info { margin: 0; padding: 10px 12px; border-radius: 8px; background: var(--ja-lavender); color: var(--ja-purple); font-size: .86rem; font-weight: 500; }
    .acc { display: grid; gap: 6px; }
    .accrow { display: flex; align-items: center; gap: 10px; padding: 9px 12px; background: #fff; border: 1px solid var(--line); border-radius: 8px; font-size: .88rem; }
    .accrow input { width: 18px; height: 18px; accent-color: var(--ja-purple); flex: none; }
    .accrow .n { flex: 1; min-width: 0; }
    .accrow .n small { display: block; color: var(--muted); font-size: .76rem; }
    .accsub { margin: 8px 0 2px; font-size: .8rem; font-weight: 700; color: var(--ja-purple); display: flex; justify-content: space-between; }
    .rq { padding: 12px 14px; background: #fff; border: 1px solid var(--line); border-radius: 10px; }
    .rq.bad { border-left: 4px solid var(--ja-crimson); } .rq.good { border-left: 4px solid var(--ja-purple); } .rq.blank { border-left: 4px solid rgba(20,16,26,.2); }
    .rq .top2 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: .8rem; color: var(--muted); margin: 0 0 6px; }
    .rq .top2 b { color: var(--ja-ink); }
    .rq p { margin: 0 0 8px; white-space: pre-wrap; font-size: .92rem; }
    .rq ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 3px; font-size: .86rem; }
    .rq li { padding: 3px 8px; border-radius: 6px; }
    .rq li.key { background: var(--ja-lavender); color: var(--ja-purple); font-weight: 600; }
    .rq li.wrong { background: var(--ja-blush); }
    .rlist { display: grid; gap: 8px; }
    .seg { display: inline-flex; padding: 3px; border-radius: 8px; background: #fff; border: 1px solid var(--line); flex-wrap: wrap; }
    .seg button { min-height: 30px; padding: 4px 12px; border: 0; border-radius: 6px; background: none; font-weight: 600; font-size: .8rem; color: var(--body); }
    .seg button[aria-pressed="true"] { background: var(--ja-purple); color: #fff; }

    /* sign in */
    .gate { position: fixed; inset: 0; z-index: 700; display: grid; place-items: center; padding: 20px; overflow-y: auto; background: var(--ja-night); }

const SUBJECTS = [
  { key: 'math', name: 'Mathematics', zh: '数学', q: 48, min: 60 },
  { key: 'physics', name: 'Physics', zh: '物理', q: 48, min: 60 },

const SUBJ = {}; SUBJECTS.forEach(s => { SUBJ[s.key] = s; });
const LETTERS = ['A', 'B', 'C', 'D'];

/* ==================== Helpers ==================== */

/* ==================== State ==================== */

const isDirector = () => !!me && me.director;

}

  const t = {};
  list.forEach(a => { const k = keys[a.testId]; if (!k || !k.answers) return; const ans = a.answers || {};
    k.answers.forEach((x, i) => { const tp = (k.topics || [])[i] || 'Other', key = (catalog[a.testId] || {}).subject + '|' + tp; t[key] = t[key] || { subject: (catalog[a.testId] || {}).subject, topic: tp, right: 0, total: 0 }; t[key].total++; if (ans[i] === x) t[key].right++; }); });

const sortedTests = () => Object.values(catalog).sort((a, b) => SUBJECTS.findIndex(s => s.key === a.subject) - SUBJECTS.findIndex(s => s.key === b.subject) || (a.n || 0) - (b.n || 0));

/* ==================== Sign in ==================== */
function gate(mode, msg, info) {
  $('gate').hidden = mode === 'off'; $('gate').setAttribute('data-mode', mode);
  $('signForm').hidden = mode !== 'signin';
  $('gLead').textContent = { loading: 'Opening…', signin: 'Sign in with the email and password given by Juniors Academy.' }[mode] || '';
  $('gLead').hidden = !$('gLead').textContent;
  $('gMsg').textContent = msg || ''; $('gMsg').hidden = !msg; $('gMsg').className = info ? 'info' : 'err';
  if (mode === 'signin') setTimeout(() => $('gEmail').focus(), 50);
}
async function start() {
  gate('loading');
  try {
    const [A0, A, F] = await Promise.all([import(FB + 'firebase-app.js'), import(FB + 'firebase-auth.js'), import(FB + 'firebase-firestore.js')]);
    const app = A0.initializeApp(FIREBASE_CONFIG);

}

    if (profile.active === false) { pendingMsg = 'Your access has been suspended. Contact Juniors Academy.'; fb.A.signOut(fb.auth); return; }

    const t0 = Date.now(); await fb.F.updateDoc(ref, { lastSeen: fb.F.serverTimestamp() });

}
function openApp() {

  $('who').innerHTML = '<b>' + esc(isDirector() ? 'Director' : profile.name) + '</b>' + esc(me.email);

  unsub.push(F.onSnapshot(F.collection(db, 'catalog'), cat, denied));

}
const subjLine = s => '<div class="subj">' + esc(s.name) + ' <em lang="zh">' + esc(s.zh) + '</em></div>';

/* ---------- student ---------- */
function studentHome() {
  const open = sortedTests().filter(t => (profile.unlocked || {})[t.id]);

  let h = '<div class="hello"><h1>Hello ' + esc(first) + '</h1><p>These mock tests follow the official CSCA format: same number of questions, same timing, same screen. Your answers go straight to Juniors Academy, who will go through the results with you.</p></div>';

    '<div class="card pad"><h3 class="h">Rules, as in the official exam</h3><ul class="rules">' +
      (zh ? '<li>This paper is in Chinese only, as in the real exam. It has six parts: characters, word choice, word differences, words in a passage, sentence completion and reading.</li>' : '<li>No calculator. Use a small whiteboard or a sheet inside a transparent sleeve for your working, as in the real online exam.</li>') +
      '<li>You can move freely between questions, change your answers and mark questions to come back to them.</li>' +
      '<li>Your answers are saved automatically. If the connection drops, sign in again: you continue where you stopped, but the timer keeps running.</li>' +
      '<li>When the time is over, your paper is submitted automatically. You can also submit before the end.</li>' +

    const mine = list.filter(a => catalog[a.testId].subject === sub.key); if (!mine.length) return '';
    const sc = mine.map(scoreOf).filter(Boolean), avg = Math.round(sc.reduce((n, r) => n + r.score, 0) / sc.length);
    const t = tps.filter(x => x.subject === sub.key).sort((x, y) => x.right / x.total - y.right / y.total);
    const weak = t.filter(x => x.total >= 3).slice(0, 3);
    return '<div class="card pad"><h3 class="h">' + esc(sub.name) + ' <small>' + mine.length + (mine.length === 1 ? ' paper' : ' papers') + ' · average <b class="score' + (avg < 60 ? ' low' : '') + '" style="font-size:1rem">' + avg + '</b> / 100 · best ' + Math.max(...sc.map(r => r.score)) + '</small></h3>' +
      (weak.length ? '<p style="margin:0 0 10px;font-size:.86rem">Work on first:</p><div class="weak">' + weak.map(x => '<span class="chip bad">' + esc(x.topic) + ' · ' + Math.round(x.right / x.total * 100) + '%</span>').join('') + '</div><br>' : '') +
      '<div class="tbars">' + t.map(x => { const p = Math.round(x.right / x.total * 100); return '<div class="tbar"><span class="n">' + esc(x.topic) + '</span><span class="track"><i class="' + (p < 50 ? 'low' : '') + '" style="width:' + p + '%"></i></span><b>' + p + '%</b></div>'; }).join('') + '</div>' +
      '<p style="margin:12px 0 0;font-size:.84rem">' + mine.sort((a, b) => ms(a.submittedAt) - ms(b.submittedAt)).map(a => '<button type="button" class="linkish" data-review="' + esc(a.id) + '">' + esc(catalog[a.testId].title) + ': ' + (scoreOf(a) || {}).score + '</button>').join(' · ') + '</p></div>';
  }).join('') || '<p class="info">No paper submitted yet.</p>';
  if (!$('revPop').open) $('revPop').showModal();
}
async function openPreview(tid) {
  const t = catalog[tid], k = keys[tid] || {};
  $('rvTitle').textContent = t.title + ' · Preview'; $('rvSub').textContent = 'What students see, with the correct answers (for you only)';
  $('rvBody').innerHTML = '<p class="muted">Loading…</p>'; $('rvBody').removeAttribute('data-aid'); if (!$('revPop').open) $('revPop').showModal();
  const test = await loadTest(tid).catch(() => null); if (!test) { $('rvBody').innerHTML = '<p class="err">Couldn\u2019t load this test.</p>'; return; }
  let lastSec = null, lastP = null;
  $('rvBody').innerHTML = '<div class="rlist">' + test.questions.map((q, i) => { const sec = sectionOf(test, i); let h = '';
    if (sec && sec !== lastSec) { lastSec = sec; h += '<div class="sect" lang="zh"><b>' + esc(sec.title) + '</b>' + (sec.instruction ? '<span>' + esc(sec.instruction) + '</span>' : '') + '</div>'; }
    if (q.p != null && q.p !== lastP && test.passages) { lastP = q.p; h += '<div class="passage" lang="zh" style="max-height:none">' + passageHTML(test.passages[q.p].text) + '</div>'; }
    return h + '<div class="rq"><div class="top2"><b>Q' + (i + 1) + '</b><span class="chip">' + esc((k.topics || [])[i] || '—') + '</span></div><p' + (hasZh(q.q) ? ' lang="zh"' : '') + '>' + esc(q.q) + '</p><ol>' + q.o.map((op, j) => '<li class="' + (j === (k.answers || [])[i] ? 'key' : '') + '"' + (hasZh(op) ? ' lang="zh"' : '') + '>' + LETTERS[j] + '. ' + esc(op) + '</li>').join('') + '</ol></div>'; }).join('') + '</div>';
}
/* ---------- question bank import ---------- */
async function importBank(file) {
  let bank; try { bank = JSON.parse(await file.text()); } catch (e) { toast('This file is not a valid question bank.'); return; }
  if (!bank || bank.format !== 'juniors-csca-bank' || !Array.isArray(bank.tests)) { toast('This file is not the CSCA question bank.'); return; }
  const bad = bank.tests.find(t => !SUBJ[t.subject] || !Array.isArray(t.questions) || t.questions.some(q => !Array.isArray(q.o) || q.o.length !== 4 || !(q.a >= 0 && q.a <= 3)));
  if (bad) { toast('The bank has an error in ' + (bad.title || bad.id) + '. Nothing was changed.'); return; }
  if (Object.keys(catalog).length && !confirm('Install ' + bank.tests.length + ' tests from this file? Tests with the same name are replaced. Students\u2019 past answers are kept and marked against the new answer keys.')) return;
  toast('Installing ' + bank.tests.length + ' tests…');
  try {
    let i = 0;
    for (const t of bank.tests) {
      const minutes = +t.minutes || SUBJ[t.subject].min, count = t.questions.length;
      await fb.F.setDoc(fb.F.doc(fb.db, 'tests', t.id), { id: t.id, subject: t.subject, n: t.n || 0, title: t.title, minutes, count, sections: t.sections || [], passages: t.passages || [], questions: t.questions.map(x => { const o = { q: x.q, o: x.o }; if (x.p != null) o.p = x.p; return o; }) });
      await fb.F.setDoc(fb.F.doc(fb.db, 'keys', t.id), { answers: t.questions.map(x => x.a), topics: t.questions.map(x => x.t || '') });
      await fb.F.setDoc(fb.F.doc(fb.db, 'catalog', t.id), { id: t.id, subject: t.subject, n: t.n || 0, title: t.title, minutes, count });
      delete testCache[t.id]; i++;
    }
    toast('Question bank installed: ' + i + ' tests');
  } catch (e) { toast(e && e.code === 'permission-denied' ? 'Refused: publish the latest Firebase rules first.' : 'Import stopped. Check the connection and try again.'); }
}
function csv() {
  const rows = doneList().filter(a => !filt.subject || catalog[a.testId].subject === filt.subject);
  const cell = v => { v = String(v == null ? '' : v); return /[",\n;]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  const out = rows.map(a => { const r = scoreOf(a) || {}, t = catalog[a.testId]; return [(students[a.uid] || {}).name || a.name, a.email, SUBJ[t.subject].name, t.title, r.score, r.correct, r.total, r.answered, when(a.startedAt), when(a.submittedAt || endsAt(a)), a.auto ? 'time ran out' : ''].map(cell).join(';'); });
  const x = document.createElement('a'); x.href = URL.createObjectURL(new Blob(['\uFEFF' + ['Student;Email;Subject;Test;Score /100;Correct;Questions;Answered;Started;Submitted;Note'].concat(out).join('\r\n')], { type: 'text/csv;charset=utf-8' }));
  x.download = 'csca-results.csv'; document.body.appendChild(x); x.click(); x.remove(); toast(rows.length + ' papers exported');
}
async function addStudent() {
  const err = t => { $('adErr').textContent = t; $('adErr').hidden = false; };
  const name = $('adName').value.trim(), email = $('adEmail').value.trim().toLowerCase(), pass = $('adPass').value;
  if (name.length < 2) return err('Enter the student\u2019s full name.');
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return err('Enter a valid email.');
  if (pass.length < 6) return err('The password needs at least 6 characters.');
  $('adGo').disabled = true;
  try {
    const sec = fb.A0.getApps().find(x => x.name === 'add-student') || fb.A0.initializeApp(FIREBASE_CONFIG, 'add-student'), secAuth = fb.A.getAuth(sec);
    const cred = await fb.A.createUserWithEmailAndPassword(secAuth, email, pass); const uid = cred.user.uid; await fb.A.signOut(secAuth);
    await fb.F.setDoc(fb.F.doc(fb.db, 'students', uid), { uid, name, email, active: true, unlocked: {}, createdAt: fb.F.serverTimestamp() });
    $('addPop').close(); toast(name + ' added. Send them their email and password.'); openAccess(uid);
  } catch (e) {
    const c = (e && e.code) || '';
    err(/email-already-in-use/.test(c) ? 'A login already exists with this email. Delete it in Firebase (juniors-csca > Authentication > Users) or use another email.' : /operation-not-allowed|admin-restricted/.test(c) ? 'Firebase blocks new accounts: in Authentication > Settings > User actions, tick \u201cEnable create (sign-up)\u201d.' : 'Couldn\u2019t create the student. Check the connection.');
  } finally { $('adGo').disabled = false; }
}

/* ==================== Events ==================== */
document.addEventListener('click', async e => {
  const q = s => e.target.closest(s); let el;
  if ((el = q('[data-opt]')) && ex) return choose(+el.getAttribute('data-opt'));
  if ((el = q('[data-go]')) && ex) return go(+el.getAttribute('data-go'));
  if (q('[data-flag]') && ex) return toggleFlag();
  if (q('[data-submit]') && ex) return askSubmit();
  if ((el = q('[data-fs]')) && ex) { const v = Math.max(.9, Math.min(1.4, (+getComputedStyle(document.documentElement).getPropertyValue('--fs') || 1) + (+el.getAttribute('data-fs')) * .1)); document.documentElement.style.setProperty('--fs', v.toFixed(2)); return; }
  if ((el = q('[data-tab]'))) { tab = el.getAttribute('data-tab'); intro = null; window.scrollTo(0, 0); return render(); }
  if ((el = q('[data-intro]'))) { intro = el.getAttribute('data-intro'); window.scrollTo(0, 0); return render(); }
  if (q('[data-back]') || q('[data-home]')) { intro = null; doneFor = null; return render(); }
  if ((el = q('[data-start]'))) { if (!$('rdy').checked) return; el.disabled = true; return startTest(el.getAttribute('data-start')); }
  if ((el = q('[data-resume]'))) { const tid = el.getAttribute('data-resume'); const t = await loadTest(tid).catch(() => null); if (t) openExam(t, attempts[attemptId(me.uid, tid)]); return; }
  if ((el = q('[data-access]'))) return openAccess(el.getAttribute('data-access'));
  if ((el = q('[data-diag]'))) return openDiag(el.getAttribute('data-diag'));
  if ((el = q('[data-review]'))) { $('rvBody').removeAttribute('data-f'); return openReview(el.getAttribute('data-review')); }
  if ((el = q('[data-rf]'))) { $('rvBody').setAttribute('data-f', el.getAttribute('data-rf')); return openReview($('rvBody').getAttribute('data-aid')); }
  if ((el = q('[data-preview]'))) return openPreview(el.getAttribute('data-preview'));
  if ((el = q('[data-rsub]'))) { filt.subject = el.getAttribute('data-rsub'); return render(); }
  if ((el = q('[data-openall]'))) { const ids = sortedTests().filter(t => t.subject === el.getAttribute('data-openall')).map(t => t.id); return setUnlock(ids, el.getAttribute('data-on') === '1'); }
  if ((el = q('[data-reset]'))) { e.preventDefault(); const a = attempts[el.getAttribute('data-reset')]; if (!a) return; const running = stateOf(a) === 'progress';
    if (!confirm(running ? 'Cancel this test in progress? The student\u2019s answers will be deleted.' : 'Allow a retake? The submitted answers will be deleted.')) return;
    try { await fb.F.deleteDoc(fb.F.doc(fb.db, 'attempts', a.id)); toast(running ? 'Test cancelled' : 'The student can take this test again'); } catch (x) { toast('Couldn\u2019t reset. Check the connection.'); } return; }
  if (q('#accSusp')) { const s = students[accUid]; await fb.F.updateDoc(fb.F.doc(fb.db, 'students', accUid), { active: s.active === false }).catch(() => {}); toast(s.active === false ? 'Access given back' : 'Student suspended'); return; }
  if (q('#accDel')) { const s = students[accUid]; if (!confirm('Delete ' + s.name + ' and all their papers? Also delete their login in Firebase (Authentication > Users) if you want to reuse the email.')) return;
    try { for (const a of Object.values(attempts).filter(x => x.uid === accUid)) await fb.F.deleteDoc(fb.F.doc(fb.db, 'attempts', a.id)); await fb.F.deleteDoc(fb.F.doc(fb.db, 'students', accUid)); $('accPop').close(); accUid = null; toast('Student deleted'); } catch (x) { toast('Couldn\u2019t delete. Check the connection.'); } return; }
  if (q('#addStudent')) { ['adName', 'adEmail', 'adPass'].forEach(i => { $(i).value = ''; }); $('adErr').hidden = true; $('addPop').showModal(); return; }
  if (q('#importBank')) return $('bankFile').click();
  if (q('#csv')) return csv();
  if (q('#btnSheet')) { $('exam').classList.toggle('show-sheet'); return; }
  if (q('#btnSubmit')) return askSubmit();
  if (q('#subGo')) return submit(false);
  if (q('[data-close]')) { q('dialog').close(); return; }
  if (e.target.id === 'btnOut') { if (!ex || confirm('Sign out? Your test keeps running and your answers are saved.')) fb.A.signOut(fb.auth); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.getAttribute && t.getAttribute('data-unlock')) setUnlock([t.getAttribute('data-unlock')], t.checked);
  if (t.id === 'bankFile' && t.files[0]) { importBank(t.files[0]); t.value = ''; }
  if (t.id === 'rdy' && $('goStart')) $('goStart').disabled = !t.checked;
});
document.addEventListener('input', e => { if (e.target.id === 'fQ') { filt.q = e.target.value; render(); } });
/* keyboard, as in a CBT exam: A to D (or 1 to 4) choose, arrows move, M marks */
document.addEventListener('keydown', e => {
  if (!ex || $('subPop').open || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase(), i = 'abcd'.indexOf(k), j = '1234'.indexOf(k);
  if (i >= 0 || j >= 0) { e.preventDefault(); choose(i >= 0 ? i : j); }
  else if (k === 'arrowright') go(ex.cur + 1); else if (k === 'arrowleft') go(ex.cur - 1); else if (k === 'm') toggleFlag();
});
$('addForm').addEventListener('submit', e => { e.preventDefault(); addStudent(); });
document.querySelectorAll('dialog.pop').forEach(d => d.addEventListener('click', e => { if (e.target === d && d.id !== 'subPop') d.close(); }));
window.addEventListener('beforeunload', e => { if (ex && ex.dirty) { save(); e.preventDefault(); e.returnValue = ''; } });
$('signForm').addEventListener('submit', async e => {
  e.preventDefault(); const b = $('gSubmit'); b.disabled = true; b.textContent = 'Signing in…';
  try { await fb.A.signInWithEmailAndPassword(fb.auth, $('gEmail').value.trim(), $('gPass').value); $('gPass').value = ''; }
  catch (x) { const c = (x && x.code) || ''; gate('signin', /too-many/.test(c) ? 'Too many tries. Wait a few minutes.' : /network/.test(c) ? 'No internet connection.' : 'Wrong email or password.'); }
  finally { b.disabled = false; b.textContent = 'Sign in'; }
});
$('gForgot').addEventListener('click', async () => {
  const email = $('gEmail').value.trim(); if (!email) { gate('signin', 'Type your email first, then click \u201cForgot my password\u201d again.', true); return; }
  try { await fb.A.sendPasswordResetEmail(fb.auth, email); } catch (x) {}
  gate('signin', 'If this account exists, an email to choose a new password is on its way.', true);
});
setInterval(() => { if (me && !ex && !isDirector()) render(); }, 15000);
start();
</script>
