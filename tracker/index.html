  <style>
    /* ============================================================
       JUNIORS TRACKER — files, visas and departures for every booking.
       Reads the bookings of the CRM (project juniors-academy) and saves its
       own data in the project juniors-tracker. Same email and password in both.
       The only thing to edit is the SETTINGS block near the bottom.
       ============================================================ */
    :root {
      /* Juniors Academy, Open Horizons identity system 3.1. Exact screen colours from the brand guide. */
      --jb-burgundy: #76142E; --jb-blue: #88B4C8; --jb-paper: #F7F4EE;
      --jb-coral: #E5A596; --jb-gold: #E8C879; --jb-sage: #A9B7A0; --jb-mauve: #AA819A;
      --jb-deep: #4E1022; --jb-deepblue: #244E66; --jb-ink: #25252A;
      /* functional status colours (separate from the brand colours) */
      --st-error: #A8201A; --st-error-soft: #FBE8EB; --st-warn: #7A5A00; --st-warn-soft: #FFF3D6; --st-ok-soft: #E7F0EA;
      --ink: var(--jb-ink); --paper: var(--jb-paper); --card: #fff;
      --blue: var(--jb-deepblue); --blue-soft: rgba(136,180,200,.3); --blue-text: var(--jb-deepblue);
      --ok: var(--jb-deepblue); --ok-soft: var(--st-ok-soft);
      --warn: var(--st-warn); --warn-soft: var(--st-warn-soft); --warn-text: var(--st-warn);
      --bad: var(--st-error); --bad-soft: var(--st-error-soft);
      --muted: rgba(37,37,42,.62); --body: rgba(37,37,42,.82); --line: rgba(37,37,42,.12);
      /* the previous names, kept so older rules follow the new palette */
      --ja-purple: var(--jb-burgundy); --ja-crimson: var(--st-error); --ja-paper: var(--jb-paper); --ja-ink: var(--jb-ink);
      --ja-night: var(--jb-deep); --ja-lavender: rgba(136,180,200,.25); --ja-blush: var(--st-error-soft); --ja-sun: var(--jb-gold); --ja-prism: none;
      --ease: cubic-bezier(.16, 1, .3, 1);
      --display: 'Poppins', 'Cairo', system-ui, sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: 'Poppins', 'Cairo', system-ui, -apple-system, sans-serif; font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    :focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; border-radius: 8px; }
    [hidden] { display: none !important; }
    .num { font-variant-numeric: tabular-nums; }
    svg.i { width: 18px; height: 18px; flex: none; }

    /* top bar */
    .top { position: sticky; top: 0; z-index: 40; display: flex; align-items: center; gap: 14px; padding: 10px clamp(12px, 3vw, 28px); padding-top: calc(10px + env(safe-area-inset-top, 0px)); background: var(--ink); color: #fff; }
    .brand { display: flex; align-items: center; gap: 11px; flex: none; }
    .seal { position: relative; width: 34px; height: 34px; border-radius: 50%; background: var(--ja-prism); padding: 3px; display: grid; place-items: center; flex: none; }
    .seal::before { content: ""; position: absolute; inset: 3px; border-radius: 50%; background: var(--ja-purple); }
    .seal svg { position: relative; width: 17px; height: 17px; color: #fff; }
    .brand b { display: block; font-family: var(--display); font-size: 1.1rem; letter-spacing: -.01em; }
    .brand small { display: block; font-size: .72rem; color: rgba(255,255,255,.55); }
    .find { position: relative; flex: 1; max-width: 440px; margin-left: auto; }
    .find svg { position: absolute; left: 12px; top: 50%; width: 16px; height: 16px; transform: translateY(-50%); opacity: .55; }
    .find input { width: 100%; min-height: 38px; padding: 6px 12px 6px 36px; border-radius: 999px; border: 1px solid rgba(255,255,255,.12); background: rgba(255,255,255,.07); color: #fff; }
    .find input::placeholder { color: rgba(255,255,255,.5); }
    .find input:focus { outline: none; border-color: rgba(255,255,255,.35); }
    .top-r { display: flex; align-items: center; gap: 8px; margin-left: auto; }
    .tbtn { display: inline-flex; align-items: center; gap: 7px; min-height: 36px; padding: 6px 14px; border-radius: 999px; border: 1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.07); color: #fff; font-weight: 600; font-size: .84rem; text-decoration: none; white-space: nowrap; }
    .tbtn:hover { background: rgba(255,255,255,.16); }
    .who { font-size: .8rem; color: rgba(255,255,255,.6); white-space: nowrap; }

    .wrap { max-width: 1440px; margin: 0 auto; padding: 22px clamp(12px, 3vw, 28px) 60px; }
    .head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px 20px; flex-wrap: wrap; margin: 0 0 16px; }
    .head h1 { margin: 0; font-family: var(--display); font-size: clamp(1.5rem, 2.6vw, 2rem); letter-spacing: -.02em; line-height: 1.1; }
    .head p { margin: 4px 0 0; color: var(--muted); font-size: .9rem; }

    /* stats */
    .stats { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; margin: 0 0 16px; }
    .stat { position: relative; text-align: left; padding: 14px 16px; border-radius: 18px; background: var(--card); border: 1px solid var(--line); transition: transform .2s var(--ease), box-shadow .2s var(--ease), border-color .2s; }
    .stat:hover { transform: translateY(-2px); box-shadow: 0 12px 26px -18px rgba(37,37,42,.45); }
    .stat[aria-pressed="true"] { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
    .stat b { display: block; font-family: var(--display); font-size: clamp(1.4rem, 2.2vw, 1.9rem); letter-spacing: -.02em; line-height: 1.05; }
    .stat span { display: block; margin-top: 3px; font-size: .8rem; color: var(--muted); font-weight: 500; }
    .stat i { position: absolute; right: 14px; top: 14px; width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; }
    .stat i svg { width: 17px; height: 17px; }
    .stat.s-ink { background: var(--ink); color: #fff; border-color: var(--ink); } .stat.s-ink span { color: rgba(255,255,255,.65); } .stat.s-ink[aria-pressed="true"] { box-shadow: 0 0 0 3px rgba(136,180,200,.9); }
    .i-blue { background: var(--blue-soft); color: var(--blue); } .i-warn { background: var(--warn-soft); color: var(--warn-text); } .i-bad { background: var(--bad-soft); color: var(--bad); } .i-ok { background: var(--ok-soft); color: var(--ok); } .i-w { background: rgba(255,255,255,.12); color: #fff; }

    /* toolbar */
    .bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 0 0 14px; }
    .chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; padding: 2px; }
    .chips::-webkit-scrollbar { display: none; }
    .chip { flex: none; display: inline-flex; align-items: center; gap: 7px; min-height: 34px; padding: 5px 13px; border-radius: 999px; border: 1px solid var(--line); background: #fff; font-weight: 600; font-size: .84rem; white-space: nowrap; color: var(--body); }
    .chip em { font-style: normal; font-size: .72rem; font-weight: 700; padding: 1px 7px; border-radius: 999px; background: rgba(37,37,42,.06); color: var(--muted); }
    .chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; } .chip[aria-pressed="true"] em { background: rgba(255,255,255,.18); color: #fff; }
    .chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
    .seg { display: inline-flex; padding: 3px; border-radius: 999px; background: #fff; border: 1px solid var(--line); }
    .seg button { display: inline-flex; align-items: center; gap: 6px; min-height: 30px; padding: 4px 12px; border: 0; border-radius: 999px; background: none; font-weight: 600; font-size: .82rem; color: var(--body); }
    .seg button[aria-pressed="true"] { background: var(--ink); color: #fff; }
    .seg svg { width: 15px; height: 15px; }
    .sel { min-height: 34px; padding: 4px 30px 4px 12px; border-radius: 999px; border: 1px solid var(--line); background: #fff; font-weight: 600; font-size: .82rem; }

    /* board */
    .board { display: grid; grid-template-columns: repeat(4, minmax(250px, 1fr)); gap: 14px; overflow-x: auto; padding-bottom: 6px; scroll-snap-type: x mandatory; }
    .col { scroll-snap-align: start; display: flex; flex-direction: column; min-width: 0; border-radius: 20px; background: rgba(37,37,42,.035); padding: 10px; min-height: 240px; }
    .col-h { display: flex; align-items: center; gap: 9px; padding: 4px 6px 10px; }
    .col-h b { font-family: var(--display); font-size: .98rem; letter-spacing: -.01em; }
    .col-h em { font-style: normal; margin-left: auto; font-size: .76rem; font-weight: 700; padding: 1px 9px; border-radius: 999px; background: #fff; color: var(--muted); border: 1px solid var(--line); }
    .col-h i { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; }
    .col-h i svg { width: 15px; height: 15px; }
    .cards { display: grid; gap: 10px; align-content: start; }
    .col-empty { padding: 26px 10px; text-align: center; font-size: .82rem; color: var(--muted); border: 1.5px dashed rgba(37,37,42,.12); border-radius: 14px; }

    .fcard { position: relative; display: block; width: 100%; text-align: left; padding: 13px 14px 12px; border-radius: 16px; background: #fff; border: 1px solid var(--line); box-shadow: 0 1px 0 rgba(37,37,42,.03); transition: transform .2s var(--ease), box-shadow .2s var(--ease), border-color .2s; animation: pop .3s var(--ease) both; }
    .fcard:hover { transform: translateY(-2px); box-shadow: 0 14px 28px -20px rgba(37,37,42,.5); border-color: rgba(37,37,42,.18); }
    .fcard.risk { border-color: rgba(168,32,26,.35); box-shadow: inset 3px 0 0 var(--bad); }
    @keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .fc-top { display: flex; align-items: center; gap: 10px; }
    .av { flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: .74rem; color: #fff; background: var(--c, #76142E); }
    .av--lg { width: 52px; height: 52px; font-size: 1.05rem; font-family: var(--display); }
    .fc-name { flex: 1; min-width: 0; }
    .fc-name b { display: block; font-size: .93rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .fc-name small { display: block; font-size: .74rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cd { flex: none; text-align: right; font-family: var(--display); font-weight: 800; font-size: 1.05rem; line-height: 1; letter-spacing: -.02em; }
    .cd small { display: block; font-family: var(--display); font-weight: 600; font-size: .64rem; letter-spacing: .02em; color: var(--muted); margin-top: 3px; }
    .cd.c-bad { color: var(--bad); } .cd.c-warn { color: var(--warn-text); } .cd.c-ok { color: var(--ok); } .cd.c-mute { color: var(--muted); font-size: .8rem; }
    .fc-prog { margin: 10px 0 8px; }
    .pbar { display: flex; gap: 3px; height: 6px; }
    .pbar i { flex: 1; border-radius: 999px; background: rgba(37,37,42,.08); overflow: hidden; position: relative; }
    .pbar i::after { content: ""; position: absolute; inset: 0; width: var(--p, 0%); background: var(--c, var(--blue)); border-radius: inherit; transition: width .5s var(--ease); }
    .fc-next { display: flex; align-items: center; gap: 6px; font-size: .8rem; color: var(--body); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .fc-next svg { width: 14px; height: 14px; color: var(--muted); }
    .fc-tags { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 9px; }
    .tag { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 999px; font-size: .7rem; font-weight: 700; white-space: nowrap; background: rgba(37,37,42,.06); color: var(--body); }
    .tag svg { width: 11px; height: 11px; }
    .t-blue { background: var(--blue-soft); color: var(--blue-text); } .t-ok { background: var(--ok-soft); color: var(--ok); } .t-warn { background: var(--warn-soft); color: var(--warn-text); } .t-bad { background: var(--bad-soft); color: var(--bad); }
    .t-prog { background: rgba(37,37,42,.06); color: var(--ink); }
    .t-prog i { width: 7px; height: 7px; border-radius: 50%; background: var(--c); }

    /* list */
    .tablewrap { background: #fff; border: 1px solid var(--line); border-radius: 20px; overflow: hidden; }
    .tscroll { overflow-x: auto; }
    table.list { width: 100%; border-collapse: collapse; min-width: 980px; }
    .list th { text-align: left; font-size: .74rem; font-weight: 600; color: var(--muted); padding: 11px 12px; border-bottom: 1px solid var(--line); background: var(--ja-paper); white-space: nowrap; }
    .list td { padding: 11px 12px; border-bottom: 1px solid var(--line); font-size: .86rem; vertical-align: middle; }
    .list tr:last-child td { border-bottom: 0; }
    .list tbody tr { cursor: pointer; } .list tbody tr:hover { background: rgba(237,233,238,.55); }
    .list .pp { display: flex; align-items: center; gap: 8px; min-width: 130px; }
    .list .pp .pbar { flex: 1; }
    .list .pp span { font-size: .76rem; font-weight: 700; color: var(--muted); width: 34px; text-align: right; }

    .empty { text-align: center; padding: 56px 20px; background: #fff; border: 1px solid var(--line); border-radius: 20px; }
    .empty h2 { margin: 12px 0 6px; font-family: var(--display); font-size: 1.3rem; }
    .empty p { margin: 0 auto; max-width: 48ch; color: var(--muted); }
    .empty .seal { margin: 0 auto; width: 48px; height: 48px; } .empty .seal svg { width: 22px; height: 22px; }

    /* drawer */
    .scrim { position: fixed; inset: 0; z-index: 60; background: rgba(37,37,42,.42); opacity: 0; pointer-events: none; transition: opacity .25s var(--ease); }
    .scrim.on { opacity: 1; pointer-events: auto; }
    .drawer { position: fixed; top: 0; right: 0; bottom: 0; z-index: 61; width: min(620px, 100vw); background: var(--paper); box-shadow: -30px 0 80px -30px rgba(37,37,42,.5); transform: translateX(104%); visibility: hidden; transition: transform .35s var(--ease), visibility 0s linear .35s; display: flex; flex-direction: column; }
    .drawer.on { transform: none; visibility: visible; transition: transform .35s var(--ease), visibility 0s; }
    .d-head { padding: 16px 18px 14px; padding-top: calc(16px + env(safe-area-inset-top, 0px)); background: var(--ink); color: #fff; }
    .d-row { display: flex; align-items: center; gap: 12px; }
    .d-row h2 { margin: 0; font-family: var(--display); font-size: 1.3rem; letter-spacing: -.01em; line-height: 1.15; }
    .d-row small { display: block; color: rgba(255,255,255,.6); font-size: .78rem; margin-top: 2px; }
    .x { flex: none; margin-left: auto; width: 38px; height: 38px; border-radius: 50%; border: 1px solid rgba(255,255,255,.25); background: transparent; color: #fff; font-size: 1.25rem; line-height: 1; }
    .d-acts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
    .d-acts a, .d-acts button { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 4px 12px; border-radius: 999px; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.18); color: #fff; font-size: .8rem; font-weight: 600; text-decoration: none; }
    .d-acts a:hover { background: rgba(255,255,255,.2); } .d-acts svg { width: 14px; height: 14px; }
    .d-acts .crm { margin-left: auto; background: #fff; color: var(--ink); border-color: #fff; }
    .d-body { flex: 1; min-height: 0; overflow-y: auto; padding: 14px 16px 30px; display: flex; flex-direction: column; gap: 12px; overscroll-behavior: contain; }
    .d-body > * { flex: none; }
    .box { background: #fff; border: 1px solid var(--line); border-radius: 18px; padding: 14px 16px; }
    .box h3 { margin: 0 0 10px; font-family: var(--display); font-size: 1rem; letter-spacing: -.01em; display: flex; align-items: center; gap: 8px; }
    .box h3 small { margin-left: auto; font-family: var(--display); font-size: .78rem; font-weight: 600; color: var(--muted); }
    .alert { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 12px; font-size: .84rem; font-weight: 500; }
    .alert + .alert { margin-top: 6px; }
    .alert svg { width: 16px; height: 16px; flex: none; margin-top: 1px; }
    .a-bad { background: var(--bad-soft); color: var(--bad); } .a-warn { background: var(--warn-soft); color: var(--warn-text); } .a-info { background: var(--blue-soft); color: var(--blue-text); }
    .alert a { color: inherit; font-weight: 700; }
    .facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .fact { padding: 9px 11px; border-radius: 12px; background: var(--paper); }
    .fact span { display: block; font-size: .7rem; color: var(--muted); font-weight: 600; }
    .fact b { display: block; font-size: .9rem; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .fld { display: grid; gap: 4px; min-width: 0; }
    .fld.full { grid-column: 1 / -1; }
    .fld label { font-size: .74rem; font-weight: 600; color: var(--body); }
    .fld input, .fld select, .fld textarea { width: 100%; min-height: 40px; padding: 7px 11px; border-radius: 11px; border: 1px solid rgba(37,37,42,.16); background: #fff; }
    .fld textarea { min-height: 80px; resize: vertical; }
    .fld input:focus, .fld select:focus, .fld textarea:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-soft); }
    .ring { display: flex; align-items: center; gap: 14px; }
    .ring svg { width: 64px; height: 64px; flex: none; transform: rotate(-90deg); }
    .ring b { font-family: var(--display); font-size: 1.5rem; letter-spacing: -.02em; }
    .ring small { display: block; color: var(--muted); font-size: .8rem; }
    .secbars { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; flex: 1; }
    .secbars div { display: grid; gap: 4px; }
    .secbars span { font-size: .7rem; font-weight: 600; color: var(--muted); display: flex; justify-content: space-between; gap: 6px; white-space: nowrap; }
    .secbars span em { color: var(--ink); }

    .sec { background: #fff; border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
    .sec > summary { list-style: none; display: flex; align-items: center; gap: 10px; padding: 13px 16px; cursor: pointer; }
    .sec > summary::-webkit-details-marker { display: none; }
    .sec > summary b { font-family: var(--display); font-size: 1rem; letter-spacing: -.01em; }
    .sec > summary em { font-style: normal; margin-left: auto; font-size: .78rem; font-weight: 700; color: var(--muted); }
    .sec > summary .chev { width: 16px; height: 16px; color: var(--muted); transition: transform .25s var(--ease); }
    .sec[open] > summary .chev { transform: rotate(90deg); }
    .sec > summary i { width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; }
    .sec > summary i svg { width: 15px; height: 15px; }
    .sec.done > summary i { background: var(--ok-soft); color: var(--ok); }
    .items { border-top: 1px solid var(--line); }
    .item { border-bottom: 1px solid var(--line); }
    .item:last-child { border-bottom: 0; }
    .item-row { display: flex; align-items: center; gap: 11px; padding: 10px 14px 10px 12px; }
    .tick { flex: none; width: 26px; height: 26px; border-radius: 50%; border: 2px solid rgba(37,37,42,.22); background: #fff; display: grid; place-items: center; transition: background .2s, border-color .2s, transform .2s var(--ease); }
    .tick svg { width: 14px; height: 14px; color: #fff; opacity: 0; transform: scale(.4); transition: opacity .2s, transform .25s var(--ease); }
    .tick:hover { border-color: var(--ok); }
    .item.is-done .tick { background: var(--ok); border-color: var(--ok); }
    .item.is-done .tick svg { opacity: 1; transform: none; }
    .item.is-na .tick { border-style: dashed; }
    .item.is-auto .tick { cursor: default; }
    .item-main { flex: 1; min-width: 0; cursor: pointer; }
    .item-main b { display: block; font-size: .9rem; font-weight: 600; }
    .item.is-done .item-main b { color: var(--muted); text-decoration: line-through; text-decoration-color: rgba(37,37,42,.25); }
    .item.is-na .item-main b { color: var(--muted); font-style: italic; }
    .item-main small { display: block; font-size: .74rem; color: var(--muted); }
    .item-meta { flex: none; display: flex; align-items: center; gap: 6px; }
    .item-more { padding: 0 14px 12px 49px; display: grid; gap: 8px; }
    .item-more .fields { grid-template-columns: 1fr 1fr; }
    .linkish { background: none; border: 0; padding: 0; color: var(--muted); font-weight: 600; font-size: .8rem; text-decoration: underline; }
    .addstep { display: flex; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--line); background: var(--ja-paper); }
    .addstep input { flex: 1; min-width: 0; min-height: 36px; padding: 6px 12px; border-radius: 999px; border: 1px solid rgba(37,37,42,.14); background: #fff; font-size: .86rem; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 36px; padding: 6px 14px; border-radius: 999px; border: 1px solid transparent; font-weight: 600; font-size: .84rem; white-space: nowrap; }
    .btn-ink { background: var(--ink); color: #fff; } .btn-light { background: #fff; border-color: var(--line); } .btn-blue { background: var(--blue); color: #fff; }
    .visa { padding: 12px 14px; border-top: 1px solid var(--line); background: var(--ja-paper); }
    .log { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    .log li { display: flex; gap: 10px; font-size: .84rem; }
    .log li i { flex: none; width: 8px; height: 8px; margin-top: 6px; border-radius: 50%; background: var(--blue); box-shadow: 0 0 0 4px var(--blue-soft); }
    .log li small { display: block; color: var(--muted); font-size: .74rem; }
    .saved { font-size: .74rem; font-weight: 600; color: var(--ok); }

    /* sign in */
    .gate { position: fixed; inset: 0; z-index: 700; display: grid; place-items: center; padding: 20px; background: var(--ja-night); overflow-y: auto; }
    .gate-card { width: min(100%, 400px); background: var(--paper); border-radius: 26px; padding: 32px 26px 24px; box-shadow: 0 40px 100px -30px rgba(0,0,0,.7); }
    .gate-card .seal { margin: 0 auto 18px; width: 50px; height: 50px; padding: 4px; } .gate-card .seal::before { inset: 4px; } .gate-card .seal svg { width: 24px; height: 24px; }
    .gate-card h1 { margin: 0 0 6px; font-family: var(--display); font-size: 1.55rem; letter-spacing: -.02em; text-align: center; }
    .gate-card .lead { margin: 0 0 18px; text-align: center; color: var(--muted); font-size: .9rem; }
    .gate-card form { display: grid; gap: 14px; }
    .gate-card .btn { width: 100%; min-height: 46px; font-size: .95rem; }
    .gmsg { margin: 0 0 14px; padding: 10px 12px; border-radius: 12px; background: var(--bad-soft); color: var(--bad); font-size: .86rem; font-weight: 500; }
    .gmsg.info { background: var(--blue-soft); color: var(--blue-text); }

    .toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 800; transform: translate(-50%, 20px); opacity: 0; pointer-events: none; background: var(--ink); color: #fff; padding: 11px 18px; border-radius: 999px; font-weight: 600; font-size: .88rem; transition: opacity .25s, transform .25s var(--ease); max-width: calc(100vw - 30px); text-align: center; }
    .toast.on { opacity: 1; transform: translate(-50%, 0); }


    /* ==================== JUNIORS ACADEMY · OPEN HORIZONS (identity system 3.1) ==================== */
    /* Burgundy leads, blue opens the frame, warm paper gives space. Flat fills only; status colours are functional. */
    body { font-size: 14.5px; line-height: 1.55; background: var(--jb-paper); color: var(--jb-ink); }
    :focus-visible { outline: 3px solid var(--jb-deepblue); outline-offset: 2px; border-radius: 8px; }
    .gate :focus-visible { outline-color: #fff; } .gate-card :focus-visible { outline-color: var(--jb-deepblue); }
    a { color: var(--jb-burgundy); }
    /* the JA mark, from the supplied master artwork */
    .seal { width: auto; height: 22px; padding: 0; border-radius: 0; background: none; display: inline-flex; }
    .seal::before { display: none; }
    .seal img { height: 100%; width: auto; display: block; }
    .gate-card .seal { height: 34px; width: auto; padding: 0; margin: 0 auto 16px; display: flex; justify-content: center; }
    .empty .seal { height: 30px; width: auto; }
    /* headings: Poppins semibold, sentence case */
    .head h1, .gate-card h1, .d-row h2 { font-weight: 600; font-style: normal; text-transform: none; letter-spacing: -.015em; color: var(--jb-ink); }
    .brand b, .col-h b, .box h3, .sec > summary b, .empty h2 { font-weight: 600; letter-spacing: -.005em; }
    .stat b, .cd, .ring b, .fact b.num { font-style: normal; }
    .stat b { font-weight: 600; } .cd { font-weight: 700; }
    /* header: white and calm */
    .top { background: #fff; color: var(--jb-ink); border-bottom: 1px solid var(--line); }
    .brand b { color: var(--jb-ink); font-size: .98rem; padding-left: 10px; border-left: 1px solid var(--line); }
    .brand small { color: var(--muted); padding-left: 10px; }
    .find input { background: var(--jb-paper); border-color: var(--line); color: var(--jb-ink); }
    .find input::placeholder { color: var(--muted); }
    .find input:focus { background: #fff; border-color: var(--jb-deepblue); box-shadow: 0 0 0 3px rgba(36,78,102,.15); }
    .find svg { opacity: .6; }
    .tbtn { border-color: rgba(37,37,42,.18); background: #fff; color: var(--jb-ink); font-weight: 500; } .tbtn:hover { background: var(--jb-paper); }
    .who { color: var(--muted); }
    /* stats */
    .stat { border-radius: 12px; border-color: var(--line); }
    .stat[aria-pressed="true"] { border-color: var(--jb-burgundy); box-shadow: 0 0 0 1px var(--jb-burgundy); }
    .stat.s-ink { background: var(--jb-burgundy); border-color: var(--jb-burgundy); color: #fff; }
    .stat.s-ink b { color: #fff; } .stat.s-ink span { color: rgba(255,255,255,.8); }
    .stat.s-ink[aria-pressed="true"] { box-shadow: 0 0 0 3px rgba(136,180,200,.9); }
    .i-blue { background: rgba(136,180,200,.3); color: var(--jb-deepblue); }
    .i-warn { background: var(--st-warn-soft); color: var(--st-warn); }
    .i-bad { background: var(--st-error-soft); color: var(--st-error); }
    .i-ok { background: var(--st-ok-soft); color: var(--jb-ink); }
    .i-w { background: rgba(255,255,255,.16); color: #fff; }
    /* filters */
    .chip { border-color: rgba(37,37,42,.14); color: var(--jb-ink); font-weight: 500; }
    .chip[aria-pressed="true"] { background: var(--jb-burgundy); border-color: var(--jb-burgundy); color: #fff; }
    .chip .dot, .t-prog i { box-shadow: 0 0 0 1px rgba(37,37,42,.25); }
    .seg button[aria-pressed="true"] { background: var(--jb-burgundy); color: #fff; }
    /* board and cards */
    .col { background: rgba(136,180,200,.16); border-radius: 14px; }
    .col-h em { border-color: var(--line); }
    .col-empty { border-color: rgba(36,78,102,.2); }
    .fcard { border-radius: 12px; border-color: var(--line); } .fcard:hover { border-color: rgba(118,20,46,.4); }
    .fcard.risk { border-color: rgba(168,32,26,.35); box-shadow: inset 3px 0 0 var(--st-error); }
    .cd.c-bad { color: var(--st-error); } .cd.c-warn { color: var(--st-warn); } .cd.c-ok { color: var(--jb-deepblue); }
    .pbar i { background: rgba(37,37,42,.08); }
    .tag { border-radius: 999px; }
    .t-blue { background: rgba(136,180,200,.3); color: var(--jb-deepblue); }
    .t-ok { background: var(--st-ok-soft); color: var(--jb-ink); }
    .t-warn { background: var(--st-warn-soft); color: var(--jb-ink); }
    .t-bad { background: var(--st-error-soft); color: var(--jb-ink); } .t-bad svg { color: var(--st-error); }
    .t-prog { background: rgba(37,37,42,.06); color: var(--jb-ink); }
    /* list */
    .tablewrap, .empty { border-radius: 14px; border-color: var(--line); }
    .list tbody tr:hover { background: rgba(136,180,200,.12); }
    /* the client file */
    .drawer { background: var(--jb-paper); }
    .d-head { background: #fff; color: var(--jb-ink); border-bottom: 1px solid var(--line); }
    .d-row small { color: var(--muted); }
    .x { border-color: rgba(37,37,42,.18); color: var(--jb-ink); } .x:hover { background: var(--jb-paper); }
    .d-acts a, .d-acts button { background: var(--jb-paper); border-color: rgba(37,37,42,.14); color: var(--jb-ink); font-weight: 500; }
    .d-acts a:hover { background: #fff; border-color: rgba(37,37,42,.3); }
    .d-acts .crm { background: var(--jb-burgundy); border-color: var(--jb-burgundy); color: #fff; font-weight: 600; }
    .d-acts .crm:hover { background: var(--jb-deep); border-color: var(--jb-deep); }
    .box, .sec { border-radius: 14px; border-color: var(--line); }
    .fact { background: var(--jb-paper); }
    .sec.done > summary i { background: var(--st-ok-soft) !important; color: var(--jb-ink) !important; }
    .alert { border-radius: 10px; }
    .a-bad { background: var(--st-error-soft); color: var(--jb-ink); } .a-bad svg { color: var(--st-error); }
    .a-warn { background: var(--st-warn-soft); color: var(--jb-ink); } .a-warn svg { color: var(--st-warn); }
    .a-info { background: rgba(136,180,200,.22); color: var(--jb-deepblue); }
    .tick:hover { border-color: var(--jb-burgundy); }
    .item.is-done .tick { background: var(--jb-burgundy); border-color: var(--jb-burgundy); }
    .log li i { background: var(--jb-deepblue); box-shadow: 0 0 0 4px rgba(136,180,200,.3); }
    .saved { color: var(--jb-deepblue); }
    .fld input, .fld select, .fld textarea, .addstep input, .sel { border-color: rgba(37,37,42,.2); }
    .fld input, .fld select, .fld textarea { border-radius: 8px; }
    .fld input:focus, .fld select:focus, .fld textarea:focus { border-color: var(--jb-deepblue); box-shadow: 0 0 0 3px rgba(36,78,102,.15); }
    .linkish { color: var(--jb-burgundy); }
    /* buttons: pills; burgundy for the main action */
    .btn-ink, .btn-blue { background: var(--jb-burgundy); color: #fff; } .btn-ink:hover, .btn-blue:hover { background: var(--jb-deep); }
    .btn-light { background: #fff; border-color: rgba(37,37,42,.18); color: var(--jb-ink); font-weight: 500; } .btn-light:hover { background: var(--jb-paper); }
    /* sign in: the reversed logo space, burgundy */
    .gate { background: var(--jb-burgundy); }
    .gate-card { background: var(--jb-paper); border-radius: 14px; }
    .gate-card .btn { min-height: 44px; }
    .gmsg { background: var(--st-error-soft); color: var(--jb-ink); border-radius: 8px; } .gmsg.info { background: rgba(136,180,200,.25); color: var(--jb-deepblue); }
    .toast { background: var(--jb-ink); }

    @media (max-width: 1100px) { .stats { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    @media (max-width: 760px) {
      .find { display: none; } .who, .brand small, .tbtn span { display: none; }
      .stats { grid-template-columns: 1fr 1fr; gap: 8px; } .stat { padding: 12px 13px; } .stat i { display: none; }
      .board { grid-template-columns: repeat(4, 86vw); }
      .facts { grid-template-columns: 1fr 1fr; } .fields, .item-more .fields { grid-template-columns: 1fr; }
      .secbars { grid-template-columns: 1fr 1fr; flex-basis: 100%; }
      .ring { flex-wrap: wrap; }
      .chips { flex-basis: 100%; order: -1; }
      .bar .sel { flex: 1; }
      .item-more { padding-left: 14px; }
      .mfind { display: block !important; }
    }
    .mfind { display: none; margin: 0 0 12px; }
    .mfind input { width: 100%; min-height: 42px; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: #fff; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

function stepsOf(b, t) {

  const base = { docs: T.docs, visa: T.visa_steps, travel: T.travel || TRAVEL_BASE, prep: T.prep || PREP_BASE };
  const custom = (t && t.custom) || [];
  const out = {};
  SECTIONS.forEach(s => {
    out[s.key] = base[s.key].filter(x => x[3] !== 'minor' || minor).map(x => ({ key: x[0], label: x[1], hint: x[2], auto: x[3] === 'auto' }))
      .concat(custom.filter(c => c.section === s.key).map(c => ({ key: c.key, label: c.label, hint: '', custom: true })));
  });
  return out;
}
function itemState(b, t, it, sec) {
  const rec = ((t && t.items) || {})[it.key] || {};
  if (it.auto) return toNum(b.fee) > 0 && balanceOf(b) === 0 ? 'done' : 'todo';
  if (sec === 'visa' && t && t.visa && t.visa.decision === 'approved') return rec.na ? 'na' : 'done';
  return rec.na ? 'na' : rec.done ? 'done' : 'todo';
}
function fileOf(id) {
  const b = bookings[id]; if (!b) return null;
  const t = files[id] || {}, steps = stepsOf(b, t), today = todayISO();
  const sec = {}; let all = 0, done = 0, next = null, overdue = 0;
  SECTIONS.forEach(s => {
    let n = 0, d = 0;
    steps[s.key].forEach(it => {

      if (st === 'done') d++;
      else {
        const due = (((t.items || {})[it.key]) || {}).due;
        if (due && due < today) overdue++;
        if (!next) next = { label: it.label, due, sec: s.key };
      }
    });
    sec[s.key] = { n, d, pct: n ? Math.round(d / n * 100) : 100 };

  });
  const visaRefused = t.visa && t.visa.decision === 'refused';
  let stage = 'ready';
  for (const s of SECTIONS) { if (sec[s.key].d < sec[s.key].n) { stage = s.key === 'prep' ? 'travel' : s.key; break; } }
  const departed = t.depart && t.depart < today;
  const days = t.depart ? dayDiff(today, t.depart) : null;
  const alerts = [];
  if (!t.depart) alerts.push(['info', 'Add the departure date to start the countdown.']);
  if (visaRefused) alerts.push(['bad', 'The visa was refused. Contact the family and decide the next step.']);
  if (days != null && days >= 0 && days <= 21 && sec.visa.d < sec.visa.n && !visaRefused) alerts.push(['bad', 'Departure in ' + days + (days === 1 ? ' day' : ' days') + ' and the visa is not ready yet.']);
  const back = t.ret || t.depart;
  if (t.passportExp && back && t.passportExp < addDays(back, 180)) alerts.push(['bad', 'The passport expires on ' + niceDate(t.passportExp) + ', less than 6 months after the return. Renew it before applying.']);
  if (overdue) alerts.push(['warn', overdue + (overdue === 1 ? ' step is' : ' steps are') + ' past the date you set.']);
  if (days != null && days >= 0 && days <= 14 && balanceOf(b) > 0) alerts.push(['warn', 'Balance of ' + money(balanceOf(b)) + ' still to pay, ' + days + ' days before departure.']);
  const missing = ['phone', 'dob'].filter(k => !b[k]);
  if (missing.length) alerts.push(['info', 'Missing in the CRM: ' + missing.map(k => ({ phone: 'phone number', dob: 'date of birth' }[k])).join(' and ') + '.']);
  const risk = alerts.some(a => a[0] === 'bad') || overdue > 0;
  return { b, t, steps, sec, all, done, pct: all ? Math.round(done / all * 100) : 0, next, stage, departed, days, alerts, risk, tk: templateKey(b.program), overdue };
}

document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'q' || el.id === 'q2') { query = el.value; ($('q') !== el) && ($('q').value = query); ($('q2') !== el) && ($('q2').value = query); return render(); }
  if (el.closest && el.closest('#drawer') && el.getAttribute('data-k') && (el.tagName === 'TEXTAREA' || el.type === 'text')) {
    const k = el.getAttribute('data-k'); clearTimeout(pending[k]); pending[k] = setTimeout(() => fieldSave(el), 900);
  }
});
document.addEventListener('submit', e => {
  const f = e.target;
  if (f.getAttribute('data-add')) {
    e.preventDefault(); const inp = f.querySelector('input'), label = inp.value.trim(); if (!label) return;
    const t = files[openId] || {}, key = 'c_' + Date.now().toString(36);
    save(openId, { custom: (t.custom || []).concat({ key, label, section: f.getAttribute('data-add') }) }, 'Added a step: ' + label);
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && openId) closeFile(); });
window.addEventListener('hashchange', () => { const m = /^#f=(.+)$/.exec(location.hash); if (m && bookings[decodeURIComponent(m[1])]) openFile(decodeURIComponent(m[1])); });

/* sign in */
$('signForm').addEventListener('submit', async e => {
  e.preventDefault(); const btn = $('gSubmit'); btn.disabled = true; btn.textContent = 'Signing in…';
  const email = $('gEmail').value.trim().toLowerCase(), pw = $('gPass').value;
  creds = { email, pw };
  try {
    const cur = fb.auth.currentUser;
    if (cur && (cur.email || '').toLowerCase() === email) { await signedIn(cur); }   /* already in the CRM: only the tracker was missing */
    else await fb.A.signInWithEmailAndPassword(fb.auth, email, pw);
    $('gPass').value = '';
  }
  catch (err) { creds = null; gate('signin', authMessage(err)); } finally { btn.disabled = false; btn.textContent = 'Sign in'; }
});
$('gForgot').addEventListener('click', async () => {
  const email = $('gEmail').value.trim(); if (!email) { gate('signin', 'Type your email first, then click “Forgot my password” again.', true); return; }
  try { await fb.A.sendPasswordResetEmail(fb.auth, email); } catch (e) {}
  gate('signin', 'If that account exists, an email to choose a new password is on its way. Use the same new password in the juniors-tracker project (Authentication, Users).', true);
});
$('nameForm').addEventListener('submit', async e => {
  e.preventDefault(); const name = $('gName').value.trim(); if (name.length < 2) return;
  const p = { uid: me.uid, name, email: me.email, createdAt: new Date().toISOString() };
  try { await fb.F.setDoc(fb.F.doc(fb.db, 'crmUsers', me.uid), p); profile = p; openApp(); } catch (err) { denied(err); }
});
setInterval(() => { if (me && profile) render(); }, 60000);
start();
</script>
</body>
</html>
